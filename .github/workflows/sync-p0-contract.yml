name: Sync P0 Contract

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync-contract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Synchronize current source of truth
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          replace(
              "docs/15_DEVELOPMENT_WORKFLOW.md",
              "After independent Review #2 is satisfactory, while the PR is still Draft:",
              "After the Review #2 cold pass is satisfactory, while the PR is still Draft:",
          )

          agents = Path("AGENTS.md")
          text = agents.read_text()
          text = text.replace("→ independent review #1\n→ fixes/commit\n→ independent review #2", "→ cold Review #1\n→ fixes/commit\n→ cold Review #2")
          text = text.replace("The label is added only after independent Review #2 while the PR is still Draft, then the PR is marked Ready.", "The label is added only after the Review #2 cold pass while the PR is still Draft, then the PR is marked Ready.")
          start = text.index("## 29. Current repository-gate mode")
          section = '''## 29. Current repository-gate mode\n\nThe repository intentionally remains private on the current free GitHub plan. Protected-branch/ruleset controls are unavailable for this setup, and the project owner has explicitly accepted **manual repository-gate enforcement** as the operating mode.\n\nWhen `docs/MANIFEST.json` reports:\n\n```text\nrepository_gate.mode = manual\n```\n\nthen:\n\n- branch → Draft PR → Review #1 → fixes → Review #2 → full CI → merge remains mandatory project policy;\n- `merge-gate` must be green before the assistant performs the merge;\n- do not direct-push roadmap implementation to `main`;\n- do not claim GitHub mechanically prevents an owner/admin bypass;\n- unavailable branch protection is **not** a P0 blocker and must not be raised again unless repository visibility/plan changes.\n\nThe only direct-to-main exception remains the already-completed empty-repository baseline seed.\n'''
          agents.write_text(text[:start] + section)

          ci = Path("docs/16_CI_AND_REPOSITORY_GATES.md")
          text = ci.read_text()
          text = text.replace("Mechanically enforce:", "Define and execute the project merge discipline:")
          old = '''Resolution options:\n\n```text\nmake the repository public\nupgrade to a GitHub plan supporting protected private repositories\nor obtain explicit user approval for temporary manual enforcement\n```'''
          new = '''The project owner has explicitly accepted this manual mode as the current operating model. No visibility change or paid GitHub plan is required for P0–P8. The assistant still treats a green `merge-gate` as mandatory before performing a merge, while documenting that GitHub itself does not make the rule unbypassable.'''
          if old not in text:
              raise SystemExit("docs/16 resolution block not found")
          text = text.replace(old, new)
          text = text.replace("`full-ci-approved` is added only after independent Review #2 while the PR is still Draft.", "`full-ci-approved` is added only after the Review #2 cold pass while the PR is still Draft.")
          tail = text.index("## Branch-protection hardening")
          replacement = '''## Repository-gate operating mode\n\nThe ideal mechanical target remains:\n\n```text\nRequire a pull request before merging\nRequire status check: merge-gate\nBlock force pushes\nBlock branch deletion\nDisable bypass where supported\n```\n\nThe current private/free repository cannot expose those controls. The owner explicitly accepts manual enforcement, so P0 is complete when the process itself is followed and the latest `merge-gate` is green.\n\nCurrent mandatory policy:\n\n```text\nno direct roadmap pushes to main\nPR stays Draft through Review #2\nfull-ci-approved only after Review #2\nReady triggers full-validation\nmerge only after full-validation + merge-gate success\nsquash merge by default\n```\n\nDo not describe this as mechanically unbypassable GitHub protection. Do not repeatedly reopen the unavailable-protection issue unless repository visibility or plan changes.\n'''
          ci.write_text(text[:tail] + replacement)

          acceptance = Path("docs/14_ACCEPTANCE_CRITERIA.md")
          text = acceptance.read_text()
          start = text.index("## Branch-protection enforcement acceptance")
          end = text.index("## P0 bootstrap-test acceptance")
          section = '''## Repository-gate acceptance\n\nMechanical target when the platform supports it:\n\n```text\nmain requires PR\nmain requires merge-gate\nbypass disabled\nforce pushes blocked\nbranch deletion blocked\n```\n\nCurrent private/free repository mode is an explicitly owner-accepted exception:\n\n```text\nrepository gate mode = manual\nPR/review/CI sequence remains mandatory\nlatest merge-gate must be green before merge\nno direct roadmap push to main\nno claim of mechanically unbypassable protection\n```\n\nUnavailable protected-branch/ruleset controls are not a P0 blocker in this accepted mode.\n\n'''
          acceptance.write_text(text[:start] + section + text[end:])

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace("Documentation baseline: **v1.9**", "Documentation baseline: **v1.10**")
          text = text.replace("P0–P6 specification           IMPLEMENTATION-READY", "P0 repository bootstrap       IMPLEMENTED\nP1–P6 specification           IMPLEMENTATION-READY")
          text = text.replace("The current private repository/plan does not expose GitHub protected branches/rulesets.\nUntil that external repository setting is resolved, the documented `merge-gate` workflow is a required **manual policy**, not a mechanically unbypassable protection.", "The repository intentionally remains private on the current free GitHub plan. Protected branches/rulesets are unavailable, and the owner has explicitly accepted **manual gate enforcement**. The assistant still requires the documented PR/review/CI sequence and a green `merge-gate` before merging, without claiming GitHub makes it unbypassable.")
          text = text.replace("- Node `24` LTS pinned in `.nvmrc`; `package.json` receives the matching engine range during P0", "- Node `24` LTS pinned in `.nvmrc`; `package.json` enforces `>=24.16 <25`")
          text = text.replace("→ independent review #1\n→ fixes\n→ reviewed commit(s)\n→ independent review #2", "→ cold Review #1\n→ fixes\n→ reviewed commit(s)\n→ cold Review #2")
          text = text.replace("v1.9 closes the final pre-code documentation hardening pass.\n\nAfter this version:\n\n```text\ndo not run another speculative documentation review\nstart P0 implementation\n```", "v1.10 records the first implementation-evidence synchronization during P0.\n\nCurrent rule:\n\n```text\ndo not run speculative documentation churn\nupdate source of truth only from implementation / CI / browser evidence or explicit owner decisions\n```")
          readme.write_text(text)

          manifest_path = Path("docs/MANIFEST.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = "1.10"
          manifest["status"] = "P0 implemented and in final review/full-CI gate; owner-approved manual repository enforcement is the accepted operating mode"
          manifest["workflow"] = "development -> checkpoint commit -> Draft PR -> cold Review #1 by project assistant -> fixes/commits -> cold Review #2 by project assistant -> add full-ci-approved -> Ready -> full-validation -> merge-gate -> fix/cold re-review/rerun if needed -> squash merge -> next branch"
          manifest["repository_files"] = [
              ".gitignore",
              ".github/workflows/ci.yml",
              ".github/dependabot.yml",
              ".nvmrc",
              "package.json",
              "pnpm-lock.yaml",
              "pnpm-workspace.yaml",
              "astro.config.mjs",
              "tsconfig.json",
              "vitest.config.ts",
              "playwright.config.ts",
              "eslint.config.mjs",
              ".prettierrc.mjs",
              ".prettierignore"
          ]
          manifest["tooling"]["astro_check"] = ["@astrojs/check", "typescript", "@types/node"]
          manifest["documentation_policy"]["state"] = "implementation-evidence-synchronized"
          manifest["documentation_policy"]["next_step"] = "complete P0 Review #2 and full CI, then begin P1"
          manifest["repository_gate"] = {
              "mode": "manual",
              "accepted_by_owner": True,
              "observed_at": "2026-08-28",
              "reason": "private repository on current free GitHub plan does not expose protected branches/rulesets",
              "policy": {
                  "pull_request_required_by_process": True,
                  "latest_merge_gate_must_be_green": True,
                  "direct_roadmap_push_to_main": False,
                  "mechanically_unbypassable": False
              },
              "reopen_only_if": "repository visibility or GitHub plan changes"
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Validate manifest and current workflow wording
        run: |
          python -m json.tool docs/MANIFEST.json >/dev/null
          if grep -Eiq 'independent review #|temporary manual enforcement' README.md AGENTS.md docs/12_DECISIONS_AND_BOUNDARIES.md docs/14_ACCEPTANCE_CRITERIA.md docs/15_DEVELOPMENT_WORKFLOW.md docs/16_CI_AND_REPOSITORY_GATES.md docs/MANIFEST.json; then
            echo "::error::Stale review/manual-gate wording remains in current source of truth"
            grep -Ein 'independent review #|temporary manual enforcement' README.md AGENTS.md docs/12_DECISIONS_AND_BOUNDARIES.md docs/14_ACCEPTANCE_CRITERIA.md docs/15_DEVELOPMENT_WORKFLOW.md docs/16_CI_AND_REPOSITORY_GATES.md docs/MANIFEST.json || true
            exit 1
          fi
      - name: Commit synchronized source of truth and remove workflow
        run: |
          rm .github/workflows/sync-p0-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align P0 autonomous workflow contract"
          git push origin HEAD:${{ github.head_ref }}
