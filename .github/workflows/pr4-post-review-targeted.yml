name: PR4 Post-Review Targeted

on:
  push:
    branches:
      - feat/sonic-field-input-measurement-family

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sonic-field-input-measurement-family

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check src/tools/pitch-detector/PitchDetector.astro tests/browser/sonic-field-input-measurement-production-layout.spec.ts

      - name: Scoped lint
        run: pnpm exec eslint src/tools/pitch-detector/PitchDetector.astro tests/browser/sonic-field-input-measurement-production-layout.spec.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run post-review browser matrix
        run: pnpm exec playwright test tests/browser/sonic-field-input-measurement-production-layout.spec.ts tests/browser/pitch-detector.spec.ts tests/browser/microphone-test-layout.spec.ts tests/browser/decibel-meter-layout.spec.ts tests/browser/pitch-detector-layout.spec.ts tests/browser/tool-touch-targets.spec.ts --project=chromium --project=firefox --project=webkit
