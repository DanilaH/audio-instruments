name: P8 VPS Caddy Docs Sync

on:
  push:
    branches:
      - feat/p8-vps-caddy-deploy-contract

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p8-vps-caddy-deploy-contract
      - name: Synchronize deployment readiness docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path_str}: expected {expected}, got {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, expected))

          replace_exact(
              "AGENTS.md",
              "Sonic Field production migration / completion record\n→ docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md",
              "Sonic Field production migration / completion record\n→ docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md\n\nProduction deployment / VPS + Caddy rollout contract\n→ docs/22_PRODUCTION_DEPLOYMENT.md",
          )
          replace_exact(
              "AGENTS.md",
              "Cloudflare Web Analytics is selected for v1 rollout but is not enabled. Remaining P8 work is actual device/browser smoke QA, production domain/deployment, analytics privacy/consent activation review, Search Console and explicit production indexing activation.",
              "Cloudflare Web Analytics is selected for v1 rollout but is not enabled. Repository-side VPS + Caddy deployment readiness is defined in `docs/22_PRODUCTION_DEPLOYMENT.md` and validated against a real Caddy 2.11.4 runtime smoke; this is not evidence of a real domain, DNS change, VPS deployment or TLS issuance. Remaining P8 work is actual device/browser smoke QA, real production domain/DNS/deployment, analytics privacy/consent activation review, Search Console and explicit production indexing activation.",
          )

          replace_exact(
              "docs/11_RELEASE_AND_ANALYTICS.md",
              "## Live post-deploy verification\n\nThe repository provides a parameterized real-origin verifier:",
              "## Production deployment contract\n\nThe canonical static deployment path is VPS + Caddy and is documented in `docs/22_PRODUCTION_DEPLOYMENT.md`. Repository readiness includes the domain-agnostic Caddyfile, deterministic deployment-contract validation and a real Caddy 2.11.4 local runtime smoke. This does **not** claim that a real production domain, DNS record, VPS release or TLS certificate exists yet.\n\nThe first production publication must use an immutable release directory plus atomic `current` symlink switch and must keep both analytics and indexing disabled until their later gates are explicitly approved.\n\n## Live post-deploy verification\n\nThe repository provides a parameterized real-origin verifier:",
          )

          replace_exact(
              "docs/13_BACKLOG_AND_ROADMAP.md",
              "P8 in progress: P8.1–P8.3 complete; hosted full browser validation, the 2026-08-31 four-viewport visual matrix, runtime accessibility and cross-engine visual spot-checks are complete; the 2026-09-01 final adversarial audit adds validated 320×844 browser/state/geometry coverage; Cloudflare Web Analytics repository readiness is implemented fail-closed; a parameterized live-release verifier is implemented but has not been run on a real origin; real-device/deployment/provider-activation/indexing rollout gates remain",
              "P8 in progress: P8.1–P8.3 complete; hosted full browser validation, the 2026-08-31 four-viewport visual matrix, runtime accessibility and cross-engine visual spot-checks are complete; the 2026-09-01 final adversarial audit adds validated 320×844 browser/state/geometry coverage; Cloudflare Web Analytics repository readiness is implemented fail-closed; a parameterized live-release verifier is implemented but has not been run on a real origin; VPS + Caddy static deployment readiness is implemented and runtime-smoked locally; real-domain/DNS/VPS, real-device, provider-activation and indexing rollout gates remain",
          )
          replace_exact(
              "docs/13_BACKLOG_AND_ROADMAP.md",
              "deploy\nGSC",
              "deploy the fail-closed static build through the reviewed VPS + Caddy contract in `docs/22_PRODUCTION_DEPLOYMENT.md`\nrun and record the real-origin live-release verifier\nGSC",
          )
          replace_exact(
              "docs/13_BACKLOG_AND_ROADMAP.md",
              "Repository-side live-release verifier readiness is recorded in `docs/evidence/P8_LIVE_RELEASE_VERIFIER_2026-09-02.md`; it does not claim that any real production origin has passed the verifier.",
              "Repository-side live-release verifier readiness is recorded in `docs/evidence/P8_LIVE_RELEASE_VERIFIER_2026-09-02.md`; it does not claim that any real production origin has passed the verifier. VPS + Caddy deployment readiness is recorded in `docs/evidence/P8_VPS_CADDY_DEPLOYMENT_READINESS_2026-09-02.md`; it does not claim a registered domain, DNS change, VPS publication or TLS issuance.",
          )
          PY
          git diff --check
      - name: Commit documentation synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/11_RELEASE_AND_ANALYTICS.md docs/13_BACKLOG_AND_ROADMAP.md
          git commit -m "docs: synchronize VPS Caddy deployment readiness"
          git push
