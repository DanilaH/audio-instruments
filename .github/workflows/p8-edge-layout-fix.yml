name: P8 Edge Layout Remediation

on:
  push:
    branches:
      - test/p8-edge-smoke

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/p8-edge-smoke
      - name: Apply stable Edge geometry fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_str}: expected 1 match, got {count}")
              path.write_text(text.replace(old, new, 1))

          replace_exact(
              "src/tools/headphone-test/HeadphoneTest.astro",
              '''    .headphone-sheet__state strong {
              white-space: normal;
            }'''.replace("            ", ""),
              '''    .headphone-sheet__state strong {
              min-height: 2.4em;
              line-height: 1.2;
              white-space: normal;
            }'''.replace("            ", ""),
          )

          replace_exact(
              "src/tools/bass-test/BassTest.astro",
              '''    .bass-panel-slot {
              grid-column: auto;
              grid-row: auto;
              min-height: 237px;
              border-top: 1px solid var(--sonic-border-soft);
              border-bottom: 1px solid var(--sonic-border-soft);
            }

            .bass-panel {
              min-height: 237px;
            }'''.replace("            ", ""),
              '''    .bass-panel-slot {
              grid-column: auto;
              grid-row: auto;
              min-height: 240px;
              border-top: 1px solid var(--sonic-border-soft);
              border-bottom: 1px solid var(--sonic-border-soft);
            }

            .bass-panel {
              min-height: 240px;
            }'''.replace("            ", ""),
          )

          spectrum = Path("src/tools/spectrum-analyzer/SpectrumAnalyzer.astro")
          spectrum_text = spectrum.read_text()
          marker = '''  @media (max-width: 980px) {'''
          if spectrum_text.count(marker) != 1:
              raise SystemExit("Spectrum stress-media insertion marker mismatch")
          spectrum_text = spectrum_text.replace(
              marker,
              '''  @media (min-width: 981px) and (max-height: 740px) {
            .spectrum-field {
              min-height: 280px;
              padding-block: 8px 7px;
            }

            .spectrum-canvas-wrap {
              min-height: 180px;
            }
          }

          @media (max-width: 980px) {'''.replace("          ", ""),
              1,
          )
          spectrum.write_text(spectrum_text)

          surround = Path("src/tools/surround-sound-test/SurroundSoundTest.astro")
          surround_text = surround.read_text()
          marker = '''  @media (max-width: 1040px) {'''
          if surround_text.count(marker) != 1:
              raise SystemExit("Surround stress-media insertion marker mismatch")
          surround_text = surround_text.replace(
              marker,
              '''  @media (min-width: 981px) and (max-height: 740px) {
            .surround-field {
              min-height: 242px;
              padding-block: 8px 7px;
            }

            .surround-stage {
              height: 160px;
              min-height: 160px;
            }
          }

          @media (max-width: 1040px) {'''.replace("          ", ""),
              1,
          )
          surround.write_text(surround_text)
          PY
          git diff --check
      - name: Commit Edge geometry fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/headphone-test/HeadphoneTest.astro src/tools/bass-test/BassTest.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro src/tools/surround-sound-test/SurroundSoundTest.astro
          git commit -m "fix: stabilize layouts in Microsoft Edge"
          git push
