name: P8 Edge Layout Remediation

on:
  push:
    branches:
      - test/p8-edge-smoke

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/p8-edge-smoke
      - name: Apply stable Edge geometry fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          headphone = Path("src/tools/headphone-test/HeadphoneTest.astro")
          text = headphone.read_text()
          old = """    .headphone-sheet__state strong {
              white-space: normal;
            }""".replace("            ", "")
          if old not in text:
              old = """    .headphone-sheet__state strong {
      white-space: normal;
    }"""
          if text.count(old) != 1:
              raise SystemExit(f"Headphone mobile state block mismatch: {text.count(old)}")
          new = """    .headphone-sheet__state strong {
      min-height: 2.4em;
      line-height: 1.2;
      white-space: normal;
    }"""
          headphone.write_text(text.replace(old, new, 1))

          bass = Path("src/tools/bass-test/BassTest.astro")
          text = bass.read_text()
          needle = "min-height: 237px;"
          if text.count(needle) != 2:
              raise SystemExit(f"Bass 237px reservations mismatch: {text.count(needle)}")
          bass.write_text(text.replace(needle, "min-height: 240px;"))

          spectrum = Path("src/tools/spectrum-analyzer/SpectrumAnalyzer.astro")
          text = spectrum.read_text()
          marker = "  @media (max-width: 980px) {"
          if text.count(marker) != 1:
              raise SystemExit("Spectrum stress-media insertion marker mismatch")
          insertion = """  @media (min-width: 981px) and (max-height: 740px) {
    .spectrum-field {
      min-height: 280px;
      padding-block: 8px 7px;
    }

    .spectrum-canvas-wrap {
      min-height: 180px;
    }
  }

  @media (max-width: 980px) {"""
          spectrum.write_text(text.replace(marker, insertion, 1))

          surround = Path("src/tools/surround-sound-test/SurroundSoundTest.astro")
          text = surround.read_text()
          marker = "  @media (max-width: 1040px) {"
          if text.count(marker) != 1:
              raise SystemExit("Surround stress-media insertion marker mismatch")
          insertion = """  @media (min-width: 981px) and (max-height: 740px) {
    .surround-field {
      min-height: 242px;
      padding-block: 8px 7px;
    }

    .surround-stage {
      height: 160px;
      min-height: 160px;
    }
  }

  @media (max-width: 1040px) {"""
          surround.write_text(text.replace(marker, insertion, 1))
          PY
          git diff --check
      - name: Commit Edge geometry fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/headphone-test/HeadphoneTest.astro src/tools/bass-test/BassTest.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro src/tools/surround-sound-test/SurroundSoundTest.astro
          git commit -m "fix: stabilize layouts in Microsoft Edge"
          git push
