name: P8 VPS Caddy Post-Review Validation

on:
  push:
    branches:
      - feat/p8-vps-caddy-deploy-contract

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:deploy-contract
      - run: pnpm test:live-release-contract
      - run: pnpm test:analytics
      - run: pnpm test:indexing
      - name: Validate Caddy 2.11.4 configuration
        run: |
          docker run --rm \
            -e SITE_DOMAIN=:8080 \
            -e SITE_ROOT=/srv/browser-audio-lab/current \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
