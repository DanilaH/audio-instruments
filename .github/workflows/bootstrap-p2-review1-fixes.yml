name: Bootstrap P2 Review 1 Fix Gate

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  review1-fix-gate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Normalize Review #1 fixes
        run: >-
          pnpm exec prettier --write
          .gitignore
          src/components/controls/FrequencyControl.astro
          src/components/feedback/MetricReadout.astro
          src/tools/tone-generator/ToneGenerator.astro
          src/tools/tone-generator/ToneGeneratorController.ts
          tests/browser/shell.spec.ts
          tests/browser/tone-generator.spec.ts
      - run: >-
          pnpm exec eslint
          src/components/controls/FrequencyControl.astro
          src/components/feedback/MetricReadout.astro
          src/tools/tone-generator/ToneGenerator.astro
          src/tools/tone-generator/ToneGeneratorController.ts
          tests/browser/shell.spec.ts
          tests/browser/tone-generator.spec.ts
      - run: pnpm check
      - run: pnpm exec vitest run tests/unit/tone-waveform.test.ts tests/unit/registry.test.ts
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Targeted Tone browser checks
        run: pnpm build && pnpm exec playwright test tests/browser/tone-generator.spec.ts tests/browser/shell.spec.ts
      - name: Commit normalized sources and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore \
            src/components/controls/FrequencyControl.astro \
            src/components/feedback/MetricReadout.astro \
            src/tools/tone-generator/ToneGenerator.astro \
            src/tools/tone-generator/ToneGeneratorController.ts \
            tests/browser/shell.spec.ts \
            tests/browser/tone-generator.spec.ts
          git rm .github/workflows/bootstrap-p2-review1-fixes.yml
          git commit -m "chore: finalize Review #1 fixes"
          git push origin HEAD:${{ github.head_ref }}
