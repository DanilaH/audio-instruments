name: Temporary Sonic Field PR2 formatting remediation

on:
  push:
    branches:
      - feat/sonic-field-spatial-output-family
    paths:
      - .github/workflows/tmp-sonic-pr2-format.yml

permissions:
  contents: write

jobs:
  format-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format migrated spatial-output tools
        run: >-
          pnpm exec prettier --write
          src/tools/phase-test/PhaseTest.astro
          src/tools/speaker-test/SpeakerTest.astro
          src/tools/stereo-test/StereoTest.astro
          src/tools/surround-sound-test/SurroundSoundTest.astro
      - name: Verify formatting
        run: >-
          pnpm exec prettier --check
          src/tools/phase-test/PhaseTest.astro
          src/tools/speaker-test/SpeakerTest.astro
          src/tools/stereo-test/StereoTest.astro
          src/tools/surround-sound-test/SurroundSoundTest.astro
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify PR2 layout and touch contracts after formatting
        run: >-
          pnpm exec playwright test
          tests/browser/tool-touch-targets.spec.ts
          tests/browser/sonic-field-spatial-output-production-layout.spec.ts
          tests/browser/speaker-layout.spec.ts
          tests/browser/stereo-phase-layout.spec.ts
          tests/browser/surround-layout.spec.ts
          --project=chromium --project=firefox --project=webkit
      - name: Persist verified formatting
        run: |
          if git diff --quiet -- src/tools/phase-test/PhaseTest.astro src/tools/speaker-test/SpeakerTest.astro src/tools/stereo-test/StereoTest.astro src/tools/surround-sound-test/SurroundSoundTest.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/phase-test/PhaseTest.astro src/tools/speaker-test/SpeakerTest.astro src/tools/stereo-test/StereoTest.astro src/tools/surround-sound-test/SurroundSoundTest.astro
          git commit -m "style: format Sonic Field spatial tools"
          git push origin HEAD:feat/sonic-field-spatial-output-family
