name: Temporary cross-browser layout repair

on:
  push:
    branches:
      - fix/runtime-layout-stability

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/runtime-layout-stability

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply targeted layout repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          noise_path = Path('src/tools/noise-generator/NoiseGenerator.astro')
          noise = noise_path.read_text()
          replacements = [
              ('Long playback: keep device/headphone volume at a comfortable level.', 'Long playback: keep device/headphone volume comfortable.'),
              ('    .noise-controls {\n      gap: 8px;\n    }', '    .noise-controls {\n      gap: 6px;\n    }'),
              ('    .noise-long-reminder-slot {\n      min-height: 48px;\n      padding-top: 5px;\n    }\n\n    .noise-long-reminder {\n      padding: 6px 8px;\n    }', '    .noise-long-reminder-slot {\n      min-height: 27px;\n      padding-top: 3px;\n    }\n\n    .noise-long-reminder {\n      padding: 4px 8px;\n      line-height: 1.25;\n    }'),
              ('  @media (prefers-reduced-motion: reduce) {\n    .noise-field__layer {', '  @media (max-width: 340px) {\n    .noise-long-reminder-slot {\n      min-height: 41px;\n    }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .noise-field__layer {'),
          ]
          for old, new in replacements:
              count = noise.count(old)
              if count != 1:
                  raise SystemExit(f'Noise replacement expected once, found {count}: {old[:80]!r}')
              noise = noise.replace(old, new, 1)
          noise_path.write_text(noise)

          spectrum_path = Path('src/tools/spectrum-analyzer/SpectrumAnalyzer.astro')
          spectrum = spectrum_path.read_text()
          old = '  @media (max-width: 340px) {\n    .spectrum-view-switch button {\n      padding-inline: 2px;\n      font-size: 0.68rem;\n      letter-spacing: -0.01em;\n    }\n  }'
          new = '  @media (max-width: 340px) {\n    .spectrum-view-switch button {\n      padding-inline: 0;\n      font-size: 0.68rem;\n      letter-spacing: -0.01em;\n    }\n  }'
          count = spectrum.count(old)
          if count != 1:
              raise SystemExit(f'Spectrum replacement expected once, found {count}')
          spectrum_path.write_text(spectrum.replace(old, new, 1))
          PY

      - name: Format repaired files
        run: pnpm exec prettier --write src/tools/noise-generator/NoiseGenerator.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro

      - name: Astro and TypeScript check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run targeted cross-browser regressions
        run: pnpm exec playwright test tests/browser/noise-generator-layout.spec.ts tests/browser/runtime-layout-stability.spec.ts

      - name: Remove temporary workflow and commit repair
        run: |
          git rm .github/workflows/temp-cross-browser-layout-repair.yml
          git add src/tools/noise-generator/NoiseGenerator.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve cross-browser layout regressions"
          git push origin HEAD:fix/runtime-layout-stability
