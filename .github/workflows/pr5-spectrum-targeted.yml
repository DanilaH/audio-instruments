name: PR5 Spectrum Targeted

on:
  push:
    branches:
      - fix/spectrum-response-visibility

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check src/tools/spectrum-analyzer/model.ts src/tools/spectrum-analyzer/renderers.ts tests/unit/spectrum-analyzer-model.test.ts

      - name: Scoped lint
        run: pnpm exec eslint src/tools/spectrum-analyzer/model.ts src/tools/spectrum-analyzer/renderers.ts tests/unit/spectrum-analyzer-model.test.ts

      - name: Spectrum model tests
        run: pnpm exec vitest run tests/unit/spectrum-analyzer-model.test.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Spectrum browser regression
        run: pnpm exec playwright test tests/browser/spectrum-analyzer.spec.ts tests/browser/spectrum-analyzer-layout.spec.ts tests/browser/spectrum-analyzer-construction-failure.spec.ts tests/browser/spectrum-analyzer-devicechange.spec.ts tests/browser/spectrum-analyzer-metadata-delay.spec.ts tests/browser/sonic-field-production-layout.spec.ts --project=chromium --project=firefox --project=webkit
