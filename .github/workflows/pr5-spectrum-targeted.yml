name: PR5 Spectrum Visual QA

on:
  push:
    branches:
      - fix/spectrum-response-visibility

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Add runner-only Spectrogram visual check
        run: |
          cat >> tests/browser/spectrum-analyzer.spec.ts <<'TS'

          test("PR5 visual QA spectrogram response", async ({ page }, testInfo) => {
            await page.setViewportSize({ width: 1366, height: 768 });
            await page.locator("[data-spectrum-start]").click();
            await page.locator('[data-spectrum-view="spectrogram"]').click();
            await page.waitForTimeout(700);

            await page.locator(".spectrum-canvas-wrap").screenshot({
              path: `pr5-visual/${testInfo.project.name}-spectrogram-desktop.png`,
            });
            await page.screenshot({
              path: `pr5-visual/${testInfo.project.name}-page-desktop.png`,
              fullPage: false,
            });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(250);
            await page.locator(".spectrum-canvas-wrap").screenshot({
              path: `pr5-visual/${testInfo.project.name}-spectrogram-mobile.png`,
            });
            await page.screenshot({
              path: `pr5-visual/${testInfo.project.name}-page-mobile.png`,
              fullPage: false,
            });
          });
          TS

      - name: Capture deterministic Spectrum QA
        run: |
          mkdir -p pr5-visual
          pnpm exec playwright test tests/browser/spectrum-analyzer.spec.ts --grep "PR5 visual QA spectrogram response" --project=chromium --project=firefox --project=webkit

      - name: Upload visual QA
        uses: actions/upload-artifact@v7
        with:
          name: pr5-spectrum-visual-qa
          path: pr5-visual
          retention-days: 30
