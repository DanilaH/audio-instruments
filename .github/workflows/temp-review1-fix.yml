name: Temporary Review One Fix

on:
  push:
    branches:
      - audit/final-release-2026-09-01

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - name: Apply documented Review One fixes
        run: python scripts/temp-review1-fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          git diff --check
          node -e 'JSON.parse(require("fs").readFileSync("docs/MANIFEST.json", "utf8"))'
          pnpm format:check
          pnpm lint
          pnpm check
          pnpm test
          pnpm test:indexing
          pnpm build
      - name: Commit validated Review One fixes
        run: |
          rm scripts/temp-review1-fix.py
          rm .github/workflows/temp-review1-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record final adversarial audit provenance"
          git push origin HEAD:audit/final-release-2026-09-01
