name: Temporary mark PR 76 ready

on:
  push:
    branches:
      - audit/runtime-consistency-2026-09-01
    paths:
      - .github/workflows/temp-pr76-ready.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 76 --repo DanilaH/audio-instruments
