name: Finalize Audio Identity v2 research prototype

on:
  push:
    branches:
      - prototype/audio-identity-v2-research
    paths:
      - .github/workflows/tmp-audio-identity-v2-render.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Persist static paths fix and formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/pages/prototypes/audio-identity/[direction]/[tool].astro")
          text = path.read_text(encoding="utf-8")
          old = '''export function getStaticPaths() {
            return directions.flatMap((direction) =>
              tools.map((tool) => ({ params: { direction, tool } })),
            );
          }'''.replace("          ", "")
          new = '''export function getStaticPaths() {
            const staticDirections = ["stereo-field", "temporal-score", "acoustic-map"] as const;
            const staticTools = ["headphone", "spectrum", "hearing"] as const;
            return staticDirections.flatMap((direction) =>
              staticTools.map((tool) => ({ params: { direction, tool } })),
            );
          }'''.replace("          ", "")
          if old not in text:
              raise SystemExit("getStaticPaths target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          pnpm exec prettier --write src/pages/prototypes/audio-identity/[direction]/[tool].astro
          git diff --check
          pnpm check
          pnpm build

      - name: Commit clean research prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/prototypes/audio-identity/[direction]/[tool].astro
          git rm .github/workflows/tmp-audio-identity-v2-render.yml
          git commit -m "prototype: finalize Audio Identity v2 comparison"
          git push origin HEAD:prototype/audio-identity-v2-research
