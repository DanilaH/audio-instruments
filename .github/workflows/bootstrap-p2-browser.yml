name: Bootstrap P2 Browser Checks

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  browser-checks:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: Remove temporary browser workflow
        run: |
          rm .github/workflows/bootstrap-p2-browser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove P2.1 browser gate"
          git push origin HEAD:${{ github.head_ref }}