name: Temporary Sonic Field PR2 review screenshots

on:
  push:
    branches:
      - feat/sonic-field-spatial-output-family
    paths:
      - .github/workflows/tmp-sonic-pr2-review-fix.yml

jobs:
  review-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check tests/browser/tmp-sonic-pr2-review-screenshot.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/tmp-sonic-pr2-review-screenshot.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-field-pr2-review-screenshots
          path: artifacts/pr2-review
          if-no-files-found: error
