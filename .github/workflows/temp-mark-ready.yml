name: Temporary Mark PR Ready

on:
  push:
    branches:
      - audit/final-release-2026-09-01

permissions:
  contents: write
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove temporary workflow from final branch head
        run: |
          rm .github/workflows/temp-mark-ready.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary ready workflow"
          git push origin HEAD:audit/final-release-2026-09-01
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 74 --repo DanilaH/audio-instruments
