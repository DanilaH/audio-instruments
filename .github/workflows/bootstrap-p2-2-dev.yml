name: Bootstrap P2.2 Developer Gate

on:
  push:
    branches:
      - p2-2-homepage-tone-integration

permissions:
  contents: write

concurrency:
  group: bootstrap-p2-2-dev
  cancel-in-progress: true

jobs:
  p2-2-dev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: p2-2-homepage-tone-integration

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize P2.2 sources
        run: pnpm exec prettier --write src/pages/index.astro src/styles/global.css tests/browser/shell.spec.ts

      - name: Lint P2.2 sources
        run: pnpm exec eslint src/pages/index.astro tests/browser/shell.spec.ts

      - name: Astro and TypeScript check
        run: pnpm check

      - name: Registry regression tests
        run: pnpm exec vitest run tests/unit/registry.test.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Homepage and Tone browser regression
        run: pnpm build && pnpm exec playwright test tests/browser/shell.spec.ts tests/browser/tone-generator.spec.ts

      - name: Capture homepage visual QA
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4321 > /tmp/p2-2-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ > /dev/null
          mkdir -p visual-qa
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch();
          for (const viewport of [
            { name: '1366x768', width: 1366, height: 768 },
            { name: '390x844', width: 390, height: 844 },
          ]) {
            const page = await browser.newPage({
              viewport: { width: viewport.width, height: viewport.height },
            });
            await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
            await page.screenshot({
              path: `visual-qa/home-${viewport.name}-fold.png`,
              fullPage: false,
            });
            await page.screenshot({
              path: `visual-qa/home-${viewport.name}-full.png`,
              fullPage: true,
            });
            await page.close();
          }
          await browser.close();
          NODE

      - name: Upload homepage visual QA
        uses: actions/upload-artifact@v7
        with:
          name: p2-2-homepage-visual-qa-${{ github.run_id }}
          path: visual-qa
          if-no-files-found: error
          retention-days: 7

      - name: Commit normalized sources and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/styles/global.css tests/browser/shell.spec.ts
          git rm .github/workflows/bootstrap-p2-2-dev.yml
          git commit -m "chore: finalize P2.2 developer gate"
          git push origin HEAD:p2-2-homepage-tone-integration
