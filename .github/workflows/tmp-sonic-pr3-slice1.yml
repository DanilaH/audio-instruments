name: Temporary Sonic Field PR3 Bass complete matrix

on:
  push:
    branches:
      - feat/sonic-field-generated-signal-family
    paths:
      - .github/workflows/tmp-sonic-pr3-slice1.yml

permissions:
  contents: write

jobs:
  bass:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Bass live-readout patch
        run: python .github/tmp-sonic-pr3-slice2.py
      - name: Apply Bass mobile stability fix
        run: python .github/tmp-sonic-pr3-bass-stability.py
      - name: Format Bass slice
        run: >-
          pnpm exec prettier --write
          src/tools/bass-test/BassTest.astro
          src/tools/bass-test/BassTestController.ts
          tests/browser/bass-test.spec.ts
          tests/browser/sonic-field-generated-signal-production-layout.spec.ts
          tests/browser/runtime-layout-stability.spec.ts
          tests/browser/tool-touch-targets.spec.ts
      - name: Verify formatting
        run: >-
          pnpm exec prettier --check
          src/tools/bass-test/BassTest.astro
          src/tools/bass-test/BassTestController.ts
          tests/browser/bass-test.spec.ts
          tests/browser/sonic-field-generated-signal-production-layout.spec.ts
          tests/browser/runtime-layout-stability.spec.ts
          tests/browser/tool-touch-targets.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Chromium Bass probe
        run: >-
          pnpm exec playwright test
          tests/browser/bass-test.spec.ts
          tests/browser/runtime-layout-stability.spec.ts
          tests/browser/sonic-field-generated-signal-production-layout.spec.ts
          --project=chromium
      - name: Verify complete Bass slice across engines
        run: >-
          pnpm exec playwright test
          tests/browser/bass-test.spec.ts
          tests/browser/sonic-field-generated-signal-production-layout.spec.ts
          tests/browser/tool-touch-targets.spec.ts
          tests/browser/runtime-layout-stability.spec.ts
          --project=chromium --project=firefox --project=webkit
      - name: Persist verified Bass slice
        run: |
          if git diff --quiet -- \
            src/tools/bass-test/BassTest.astro \
            src/tools/bass-test/BassTestController.ts \
            tests/browser/bass-test.spec.ts \
            tests/browser/sonic-field-generated-signal-production-layout.spec.ts \
            tests/browser/runtime-layout-stability.spec.ts \
            tests/browser/tool-touch-targets.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tools/bass-test/BassTest.astro \
            src/tools/bass-test/BassTestController.ts \
            tests/browser/bass-test.spec.ts \
            tests/browser/sonic-field-generated-signal-production-layout.spec.ts \
            tests/browser/runtime-layout-stability.spec.ts \
            tests/browser/tool-touch-targets.spec.ts
          git commit -m "feat: finish Bass generated-signal migration"
          git push origin HEAD:feat/sonic-field-generated-signal-family
