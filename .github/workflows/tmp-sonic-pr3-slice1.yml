name: Temporary Sonic Field PR3 slice 1 geometry

on:
  push:
    branches:
      - feat/sonic-field-generated-signal-family
    paths:
      - .github/workflows/tmp-sonic-pr3-slice1.yml

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: python .github/tmp-sonic-pr3-slice1-fix.py
      - run: pnpm exec prettier --write src/tools/tone-generator/ToneGenerator.astro src/tools/frequency-sweep/FrequencySweep.astro tests/browser/sonic-field-generated-signal-production-layout.spec.ts tests/browser/tmp-sonic-pr3-geometry.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Probe Tone geometry
        run: pnpm exec playwright test tests/browser/tmp-sonic-pr3-geometry.spec.ts --project=chromium
