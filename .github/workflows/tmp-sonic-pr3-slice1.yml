name: Temporary Sonic Field PR3 slice 1 compact probe

on:
  push:
    branches:
      - feat/sonic-field-generated-signal-family
    paths:
      - .github/workflows/tmp-sonic-pr3-slice1.yml

jobs:
  compact-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply slice-one remediation
        run: python .github/tmp-sonic-pr3-slice1-fix.py
      - name: Format affected files
        run: >-
          pnpm exec prettier --write
          src/tools/tone-generator/ToneGenerator.astro
          src/tools/frequency-sweep/FrequencySweep.astro
          tests/browser/tone-generator.spec.ts
          tests/browser/frequency-sweep-layout.spec.ts
          tests/browser/sonic-field-generated-signal-production-layout.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify compact Tone gates
        run: >-
          pnpm exec playwright test
          tests/browser/tone-generator.spec.ts
          tests/browser/sonic-field-generated-signal-production-layout.spec.ts
          --project=chromium
