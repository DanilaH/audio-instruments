name: Temporary Audio v2 spectrum rerender

on:
  push:
    branches:
      - prototype/audio-identity-v2-research
    paths:
      - .github/workflows/tmp-audio-v2-spectrum-rerender.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile

      - name: Apply screenshot-only synthetic spectrogram textures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/pages/prototypes/audio-identity/[direction]/[tool].astro")
          s = p.read_text(encoding="utf-8")
          css = "\n  /* Screenshot-only synthetic spectrogram texture correction. */\n  .prototype--stereo-field .spectrogram { background: radial-gradient(ellipse at 22% 28%, rgb(69 197 208 / .76), transparent 10%), radial-gradient(ellipse at 39% 58%, rgb(244 211 94 / .58), transparent 13%), radial-gradient(ellipse at 58% 35%, rgb(255 112 100 / .5), transparent 11%), radial-gradient(ellipse at 76% 65%, rgb(69 197 208 / .6), transparent 14%), repeating-linear-gradient(0deg, transparent 0 44px, rgb(244 239 230 / .06) 45px), #0a0d12; }\n  .prototype--temporal-score .spectrogram { background: linear-gradient(115deg, transparent 0 16%, rgb(53 86 216 / .28) 16.2% 17%, transparent 17.2% 31%, rgb(23 23 21 / .28) 31.2% 32%, transparent 32.2% 51%, rgb(217 76 53 / .22) 51.2% 52%, transparent 52.2% 72%, rgb(53 86 216 / .24) 72.2% 73%, transparent 73.2%), repeating-linear-gradient(90deg, transparent 0 79px, rgb(23 23 21 / .11) 80px), repeating-linear-gradient(0deg, transparent 0 52px, rgb(23 23 21 / .08) 53px), #efeee8; }\n  .prototype--acoustic-map .spectrogram { background: radial-gradient(ellipse at 18% 24%, rgb(224 176 74 / .88), transparent 10%), radial-gradient(ellipse at 31% 61%, rgb(69 179 174 / .78), transparent 13%), radial-gradient(ellipse at 47% 38%, rgb(224 176 74 / .7), transparent 11%), radial-gradient(ellipse at 61% 70%, rgb(172 77 56 / .52), transparent 12%), radial-gradient(ellipse at 76% 48%, rgb(69 179 174 / .75), transparent 14%), radial-gradient(ellipse at 88% 27%, rgb(224 176 74 / .72), transparent 9%), repeating-linear-gradient(0deg, transparent 0 39px, rgb(246 240 231 / .08) 40px), #173844; }\n"
          head, sep, tail = s.rpartition("</style>")
          if not sep:
              raise SystemExit("style close not found")
          p.write_text(head + css + "\n</style>" + tail, encoding="utf-8")
          PY
          pnpm exec prettier --write src/pages/prototypes/audio-identity/[direction]/[tool].astro
          pnpm check
          pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - name: Capture corrected Spectrum comparison
        run: |
          mkdir -p audio-v2-spectrum-rerender
          cat > tests/browser/tmp-audio-v2-spectrum.spec.ts <<'EOF'
          import { test } from "@playwright/test";
          for (const direction of ["stereo-field", "temporal-score", "acoustic-map"] as const) {
            test(direction, async ({ page }) => {
              await page.setViewportSize({ width: 1366, height: 768 });
              await page.goto(`/prototypes/audio-identity/${direction}/spectrum`);
              await page.screenshot({ path: `audio-v2-spectrum-rerender/${direction}-spectrum-1366x768.png`, fullPage: false });
            });
          }
          EOF
          pnpm exec playwright test tests/browser/tmp-audio-v2-spectrum.spec.ts --project=chromium --workers=1 --reporter=line

      - uses: actions/upload-artifact@v7
        with:
          name: audio-v2-spectrum-rerender-${{ github.run_id }}
          path: audio-v2-spectrum-rerender
          if-no-files-found: error
          retention-days: 14
