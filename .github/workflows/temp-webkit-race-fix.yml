name: Temporary WebKit Reanchor Validation

on:
  push:
    branches:
      - audit/final-release-2026-09-01

permissions:
  contents: write

jobs:
  targeted-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - name: Apply race fix
        run: python scripts/temp-fix-latency-race.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks
        run: |
          pnpm exec prettier --check tests/browser/audio-latency.spec.ts
          pnpm exec eslint tests/browser/audio-latency.spec.ts
          pnpm check
      - name: Build
        run: pnpm build
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: Repeat WebKit scenario
        run: pnpm exec playwright test tests/browser/audio-latency.spec.ts --project=webkit --grep reanchors --repeat-each=30
      - name: Commit validated fix
        run: |
          rm scripts/temp-fix-latency-race.py
          rm .github/workflows/temp-webkit-race-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: make latency reanchor assertion atomic"
          git push origin HEAD:audit/final-release-2026-09-01
