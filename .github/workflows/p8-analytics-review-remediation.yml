name: P8 Analytics Review Remediation

on:
  push:
    branches:
      - feat/p8-cloudflare-analytics-readiness

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p8-cloudflare-analytics-readiness
      - name: Apply Cloudflare installation-ownership remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path_str}: expected {expected}, got {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, expected))

          replace_exact(
              "src/pages/privacy.astro",
              "No analytics provider is enabled in this build. Cloudflare Web\n          Analytics is selected for the production rollout, but activation\n          remains fail-closed until the deployment privacy/consent review is\n          explicitly approved and a site token is configured.",
              "This build does not enable an analytics provider. Cloudflare Web\n          Analytics is selected for the production rollout, but activation\n          remains fail-closed until the deployment privacy/consent review is\n          explicitly approved, a site token is configured, and Cloudflare\n          automatic beacon injection is disabled so this build remains the\n          single analytics installation owner.",
          )
          replace_exact(
              "scripts/verify-analytics-build.mjs",
              '"No analytics provider is enabled in this build.",',
              '"This build does not enable an analytics provider.",',
          )
          replace_exact(
              "docs/11_RELEASE_AND_ANALYTICS.md",
              "Before those values are supplied in a real deployment, determine the required consent behavior for the actual deployment jurisdictions, verify the real Cloudflare site/token and network behavior, confirm that no microphone/recording content enters analytics, and record the deployment decision. `ANALYTICS_PRIVACY_REVIEW=approved` is a technical release gate, not a universal legal conclusion.",
              "Manual snippet installation is the single v1 analytics owner. If the production hostname is proxied through Cloudflare, Cloudflare automatic Web Analytics injection must be disabled / switched to manual JS snippet installation before release; otherwise edge injection could bypass the repository's disabled state or create duplicate beacons.\n\nBefore those values are supplied in a real deployment, determine the required consent behavior for the actual deployment jurisdictions, verify the real Cloudflare site/token and network behavior, verify automatic injection is disabled, confirm that no microphone/recording content enters analytics, and record the deployment decision. `ANALYTICS_PRIVACY_REVIEW=approved` is a technical release gate, not a universal legal conclusion.",
          )
          replace_exact(
              "docs/19_PRIVACY_AND_LEGAL.md",
              "The approval flag is a release-control mechanism, not a legal guarantee. Evidence: `docs/evidence/P8_ANALYTICS_READINESS_2026-09-02.md`.",
              "Manual snippet installation is the single v1 analytics owner. A Cloudflare-proxied production hostname must have automatic Web Analytics injection disabled / switched to manual JS snippet installation before release so edge injection cannot bypass the build-state disclosure or create a second beacon.\n\nThe approval flag is a release-control mechanism, not a legal guarantee. Evidence: `docs/evidence/P8_ANALYTICS_READINESS_2026-09-02.md`.",
          )
          replace_exact(
              "docs/13_BACKLOG_AND_ROADMAP.md",
              "configure the real Cloudflare site/token and approve deployment-jurisdiction privacy/consent behavior before enabling Web Analytics",
              "configure the real Cloudflare site/token, disable Cloudflare automatic beacon injection in favor of the repository-owned manual snippet, and approve deployment-jurisdiction privacy/consent behavior before enabling Web Analytics",
          )
          replace_exact(
              "docs/evidence/P8_ANALYTICS_READINESS_2026-09-02.md",
              "The privacy-review flag is a technical release gate only. It does not itself make a legal determination about consent requirements in every deployment jurisdiction.",
              "The privacy-review flag is a technical release gate only. It does not itself make a legal determination about consent requirements in every deployment jurisdiction.\n\nManual snippet installation is the single v1 analytics installation owner. Cloudflare supports automatic edge injection for proxied sites; that mode must be disabled / changed to manual JS snippet installation for the production hostname before activation so it cannot bypass the repository's fail-closed state or create a duplicate beacon.",
          )
          replace_exact(
              "docs/evidence/P8_ANALYTICS_READINESS_2026-09-02.md",
              "real Cloudflare Web Analytics site token\nproduction-domain decision",
              "real Cloudflare Web Analytics site token\nCloudflare automatic beacon injection disabled / manual snippet mode confirmed\nproduction-domain decision",
          )
          PY
          git diff --check
      - name: Format changed source/test files
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/pages/privacy.astro scripts/verify-analytics-build.mjs
          git diff --check
      - name: Commit review remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/privacy.astro scripts/verify-analytics-build.mjs docs
          git commit -m "fix: make manual analytics installation authoritative"
          git push
