name: P8 Live Release Targeted

on:
  push:
    branches:
      - feat/p8-live-release-verifier

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:live-release-contract
      - run: pnpm test:analytics
      - run: pnpm test:indexing
