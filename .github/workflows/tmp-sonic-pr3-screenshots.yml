name: Temporary Sonic Field PR3 visual QA contact sheets

on:
  push:
    branches:
      - feat/sonic-field-generated-signal-family
    paths:
      - .github/workflows/tmp-sonic-pr3-screenshots.yml

permissions:
  contents: write

jobs:
  contact-sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Build PDF contact sheets
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.github/tmp-pr3-screenshots')
          tools = ['tone-generator', 'frequency-sweep', 'bass-test', 'noise-generator', 'sound-test']
          viewports = ['1366x768', '1440x900', '1280x720', '390x844']
          pages = []
          font = ImageFont.load_default()

          for viewport in viewports:
              if viewport == '390x844':
                  canvas = Image.new('RGB', (2200, 980), 'white')
                  draw = ImageDraw.Draw(canvas)
                  draw.text((20, 15), f'PR3 visual QA — {viewport}', fill='black', font=font)
                  x = 20
                  for tool in tools:
                      img = Image.open(root / f'{tool}-{viewport}.png').convert('RGB')
                      img.thumbnail((390, 844))
                      canvas.paste(img, (x, 70))
                      draw.text((x, 50), tool, fill='black', font=font)
                      x += 430
              else:
                  canvas = Image.new('RGB', (2440, 2280), 'white')
                  draw = ImageDraw.Draw(canvas)
                  draw.text((20, 15), f'PR3 visual QA — {viewport}', fill='black', font=font)
                  for index, tool in enumerate(tools):
                      row, col = divmod(index, 2)
                      x = 20 + col * 1210
                      y = 60 + row * 735
                      img = Image.open(root / f'{tool}-{viewport}.png').convert('RGB')
                      img.thumbnail((1180, 665))
                      draw.text((x, y), tool, fill='black', font=font)
                      canvas.paste(img, (x, y + 22))
              pages.append(canvas)

          out = root / 'pr3-visual-qa.pdf'
          pages[0].save(out, save_all=True, append_images=pages[1:], resolution=120.0)
          PY
      - name: Persist PDF for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-pr3-screenshots/pr3-visual-qa.pdf
          git commit -m "chore: add temporary PR3 visual QA contact sheet"
          git push origin HEAD:feat/sonic-field-generated-signal-family
