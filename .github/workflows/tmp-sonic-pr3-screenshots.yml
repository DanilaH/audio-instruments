name: Temporary Sonic Field PR3 visual QA export

on:
  push:
    branches:
      - feat/sonic-field-generated-signal-family
    paths:
      - .github/workflows/tmp-sonic-pr3-screenshots.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: pr3-visual-qa
          path: .github/tmp-pr3-screenshots/pr3-visual-qa.pdf
          if-no-files-found: error
          retention-days: 1
