name: Bootstrap Developer Checks

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  developer-checks:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Normalize implementation files
        run: >-
          pnpm exec prettier --write
          "src/**/*.{astro,css,js,mjs,ts}"
          "tests/**/*.{js,mjs,ts}"
          "playwright.config.ts"
          "vitest.config.ts"
          "eslint.config.mjs"
          ".prettierrc.mjs"
          "astro.config.mjs"
          "pnpm-workspace.yaml"
          "package.json"
          "tsconfig.json"
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Commit normalized sources and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-dev-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize P0 review-ready diff"
          git push origin HEAD:${{ github.head_ref }}
