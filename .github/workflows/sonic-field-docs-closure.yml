name: Sonic Field Docs Closure

on:
  push:
    branches:
      - docs/sonic-field-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/sonic-field-closure
      - name: Synchronize completed Sonic Field source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_str)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path_str}: expected {expected} occurrence(s), got {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, expected))

          replace_exact('README.md', 'The working visual direction is **Soft Sonic Studio**: a warm, friendly, expressive browser audio lab rather than a generic utility site.', 'The production visual direction is **Sonic Field**: audio relationships made visible through a compact field / rail / state instrument system rather than a generic utility shell.')
          replace_exact('README.md', 'The dynamic waveform motif may use a subtle blur and a short disappearing trail.', 'Blur, trails and other motion are allowed only when they communicate real signal/state; generic decorative motion is not part of the production system.')
          replace_exact('README.md', 'Automated P8 release validation is now recorded in `docs/evidence/P8_RELEASE_VALIDATION_2026-08-31.md`: exact-head full Chromium/Firefox/WebKit validation is green, historical visual QA across the homepage + all 16 tool routes at 1440×900, 1366×768, 1024×768 and 390×844 is complete; the separate 2026-09-01 adversarial audit adds validated 320×844 browser/state/geometry coverage, and runtime axe audit reports zero WCAG A/AA violations on 34 desktop/mobile surfaces for that same 17-page scope, and cross-engine visual spot-checks found no material rendering regression. Remaining P8 work is real-device/browser smoke QA, production domain/deployment, Cloudflare Web Analytics enablement plus privacy/consent review, Search Console and explicit final indexing activation.', 'Automated P8 release validation is now recorded in `docs/evidence/P8_RELEASE_VALIDATION_2026-08-31.md`: exact-head full Chromium/Firefox/WebKit validation is green, historical visual QA across the homepage + all 16 tool routes at 1440×900, 1366×768, 1024×768 and 390×844 is complete; the separate 2026-09-01 adversarial audit adds validated 320×844 browser/state/geometry coverage, and runtime axe audit reports zero WCAG A/AA violations on 34 desktop/mobile surfaces for that same 17-page scope, and cross-engine visual spot-checks found no material rendering regression. Remaining P8 work is real-device/browser smoke QA, production domain/deployment, Cloudflare Web Analytics enablement plus privacy/consent review, Search Console and explicit final indexing activation.\n\nThe Sonic Field production migration is now complete across all 16 live tools. The reviewed rollout ran through PRs #79, #81, #83, #85, #86 and #87; post-release contrast closure PR #88 then passed a 54-surface Chromium WCAG A/AA + horizontal-overflow audit with 0 violation surfaces and 0 overflow surfaces, followed by green authoritative Full Validation and `merge-gate`. Canonical closure evidence: `docs/evidence/SONIC_FIELD_POST_RELEASE_CLOSURE_2026-09-02.md`.')
          replace_exact('README.md', '├── 20_P0_TOOLING_CONTRACT.md\n├── CHANGELOG.md', '├── 20_P0_TOOLING_CONTRACT.md\n├── 21_SONIC_FIELD_PRODUCTION_MIGRATION.md\n├── CHANGELOG.md')
          replace_exact('README.md', '    └── P8_FINAL_ADVERSARIAL_AUDIT_2026-09-01.md', '    ├── P8_FINAL_ADVERSARIAL_AUDIT_2026-09-01.md\n    └── SONIC_FIELD_POST_RELEASE_CLOSURE_2026-09-02.md')

          replace_exact('AGENTS.md', 'Locked direction:\n\n```text\nSoft Sonic Studio\nwarm near-white base\nsoft ink\nrounded/tinted instrument surfaces\ntool-specific visual grammar\naudio-derived visuals\ndynamic waveform motif\nsubtle blur + short trail\n```', 'Locked direction:\n\n```text\nSonic Field\naudio relationships made visible\none coherent instrument sheet\nfield / rail / state hierarchy\nlow-chroma neutral working surfaces\nsemantic teal / amber / rust only\naudio-native geometry\nmotion only where signal/state is alive\nmeasurement-looking graphics only from real tool data/state\n```')
          replace_exact('AGENTS.md', 'The 2026-08-31 automated P8 release evidence is recorded in `docs/evidence/P8_RELEASE_VALIDATION_2026-08-31.md`: exact-head hosted Chromium/Firefox/WebKit validation is green; visual QA covered the then-required 1440×900, 1366×768, 1024×768 and 390×844 matrix; runtime accessibility and cross-engine visual spot-checks are complete. A separate final adversarial audit on 2026-09-01 added 320×844 to the required matrix, fixed the homepage overflow found there, and validated the narrow browser/state/geometry surface; see `docs/evidence/P8_FINAL_ADVERSARIAL_AUDIT_2026-09-01.md`. Cloudflare Web Analytics is selected for v1 rollout but is not enabled. Remaining P8 work is actual device/browser smoke QA, production domain/deployment, analytics privacy/consent activation review, Search Console and explicit production indexing activation.', 'The 2026-08-31 automated P8 release evidence is recorded in `docs/evidence/P8_RELEASE_VALIDATION_2026-08-31.md`: exact-head hosted Chromium/Firefox/WebKit validation is green; visual QA covered the then-required 1440×900, 1366×768, 1024×768 and 390×844 matrix; runtime accessibility and cross-engine visual spot-checks are complete. A separate final adversarial audit on 2026-09-01 added 320×844 to the required matrix, fixed the homepage overflow found there, and validated the narrow browser/state/geometry surface; see `docs/evidence/P8_FINAL_ADVERSARIAL_AUDIT_2026-09-01.md`. Cloudflare Web Analytics is selected for v1 rollout but is not enabled. Remaining P8 work is actual device/browser smoke QA, production domain/deployment, analytics privacy/consent activation review, Search Console and explicit production indexing activation.\n\nThe Sonic Field production migration is complete across all 16 live tools. Do not treat Soft Sonic Studio as an alternative active direction or reintroduce its pastel split-panel grammar. The final post-release accessibility/overflow closure and exact CI provenance are recorded in `docs/evidence/SONIC_FIELD_POST_RELEASE_CLOSURE_2026-09-02.md`.')

          replace_exact('docs/04_VISUAL_SYSTEM.md', '## Transitional legacy tokens\n\nThe old Soft Sonic Studio tokens/components may remain temporarily in source **only for tools that have not yet migrated**.\n\nThey are implementation debt during the staged rollout, not an approved alternative visual system.\n\nDo not use legacy `lavender / blue / mint / peach / yellow` tool accents in new Sonic Field work.\n\n`InstrumentSurface` remains a legacy primitive until its remaining consumers migrate. New migrated tools use the Sonic Field instrument primitive.', '## Legacy cleanup boundary\n\nThe Sonic Field migration is complete across all live tools. Soft Sonic Studio is superseded and is not an approved alternative production visual system.\n\nAny old Soft Sonic Studio tokens/components that remain in source are cleanup debt only; do not attach new live-route work to them.\n\nDo not restore legacy `lavender / blue / mint / peach / yellow` tool accents, pastel split-panel surfaces or `InstrumentSurface`-style composition as primary working UI. Live tool work uses the Sonic Field production layer.')
          replace_exact('docs/04_VISUAL_SYSTEM.md', 'No new migrated tool should use lavender/purple branding or a separate pastel accent just to differentiate itself.', 'No live tool or new production work should use lavender/purple branding or a separate pastel accent just to differentiate itself.')

          replace_exact('docs/12_DECISIONS_AND_BOUNDARIES.md', 'VIS-01 Soft Sonic Studio is the core art direction.', 'VIS-01 Sonic Field is the core production art direction.')
          replace_exact('docs/12_DECISIONS_AND_BOUNDARIES.md', 'VIS-02 Dynamic audio-derived visuals are a primary identity motif.', 'VIS-02 Audio relationships made visible through real signal/state/spatial/frequency/time semantics are the primary identity motif.')
          replace_exact('docs/12_DECISIONS_AND_BOUNDARIES.md', 'VIS-03 Subtle blur and short fading trails are approved.', 'VIS-03 Blur, trails and motion are approved only when they communicate real signal/state; generic decorative motion is not approved.')
          replace_exact('docs/12_DECISIONS_AND_BOUNDARIES.md', 'VIS-09 Accent colors may not be used as text/focus/state indicators unless contrast requirements are satisfied.', 'VIS-09 Accent colors may not be used as text/focus/state indicators unless contrast requirements are satisfied.\nVIS-10 Soft Sonic Studio is superseded; legacy tokens/components are cleanup debt, not an alternative production system.')

          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', 'Status: **accepted direction / implementation plan**.', 'Status: **production migration complete / canonical completion record**.')
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', 'This document converts the approved Sonic Field v3.1 prototype into a production migration plan for the 16 live Browser Audio Lab tools.', 'This document records the approved Sonic Field v3.1 production migration for the 16 live Browser Audio Lab tools, including the historical QA baseline, execution units and completion gates.')
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', '### 1.1 Source-of-truth precedence during migration\n\nThe current `docs/04_VISUAL_SYSTEM.md` still describes the superseded **Soft Sonic Studio** direction. It conflicts with this migration plan on palette, radii, motion, surfaces and per-tool accents.\n\nUntil PR1 updates the canonical visual-system docs:\n\n1. this document is authoritative for Sonic Field migration decisions;\n2. existing measurement/safety/browser/architecture contracts remain authoritative where they do not conflict with visual styling;\n3. PR1 must update `04_VISUAL_SYSTEM.md` to the accepted Sonic Field direction;\n4. PR1 must update `05_UX_UI.md` where the viewport gates/shared primitive inventory changed.\n\nDo not leave two active visual systems in the merged production documentation.', '### 1.1 Source-of-truth after migration\n\nThe migration is complete. `docs/04_VISUAL_SYSTEM.md` and `docs/05_UX_UI.md` are the canonical current visual/UX contracts; this document preserves the migration rationale, historical QA baseline, execution sequence and completion provenance.\n\nSoft Sonic Studio is superseded. Do not treat historical rollout language below as permission to restore a second active visual system. Measurement, safety, browser and architecture contracts remain authoritative in their existing topic documents.')
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', 'The current purple focus token is not grandfathered in. PR1 must replace it with a non-purple focus treatment that remains clearly visible and meets the existing contrast/accessibility contract. Pick the final treatment by rendered contrast/visibility, not by palette fashion.', 'Purple focus treatment is not approved. Production uses a dedicated non-purple focus treatment that must remain clearly visible and satisfy the existing contrast/accessibility contract; choose future adjustments by rendered contrast/visibility, not palette fashion.')
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', '## 6. Manual QA findings — current production status\n\nThe following list comes from manual testing after the previous automated layout-hardening pass. The status below is based on a fresh inspection of current `main` (`68fef62`).', '## 6. Manual QA findings — historical pre-migration baseline\n\nThe following list is preserved from manual testing before the Sonic Field rollout. Its per-item `Status` lines describe the pre-migration baseline inspected at `main` `68fef62`; they are historical findings, not the current production state. Their implementation resolution is represented by the completed PR sequence in section 8 and the post-release closure evidence.')
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', '## 8. Implementation sequence\n\nThe migration must follow the repository workflow in `15_DEVELOPMENT_WORKFLOW.md`: one coherent PR per development unit, Draft PR, cold review #1, fixes, cold review #2, full-CI authorization, full validation, green merge gate, squash merge.', '## 8. Implementation sequence — completed\n\nThe migration completed through reviewed units following `15_DEVELOPMENT_WORKFLOW.md`:\n\n- PR #79 — foundation + Headphone / Spectrum visual / Hearing stress trio;\n- PR #81 — spatial output family;\n- PR #83 — generated-signal family;\n- PR #85 — input / measurement family;\n- PR #86 — Spectrum display-response audit;\n- PR #87 — Audio Latency;\n- PR #88 — post-release Sonic Field contrast closure.\n\nThe detailed per-PR scopes below are preserved as the execution record, not as open future work.')
          for old, new in [('### PR 1 — Foundation + stress trio', '### PR 1 — Foundation + stress trio — COMPLETED (#79)'), ('### PR 2 — Spatial output family', '### PR 2 — Spatial output family — COMPLETED (#81)'), ('### PR 3 — Generated-signal family', '### PR 3 — Generated-signal family — COMPLETED (#83)'), ('### PR 4 — Input / measurement family', '### PR 4 — Input / measurement family — COMPLETED (#85)'), ('### PR 5 — Spectrum display-response audit', '### PR 5 — Spectrum display-response audit — COMPLETED (#86)'), ('### PR 6 — Audio Latency + site-shell finishing pass', '### PR 6 — Audio Latency + site-shell finishing pass — COMPLETED (#87)')]:
              replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', old, new)
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', 'The Sonic Field production migration proceeds independently through reviewed PRs. Do not turn indexing on merely because the visual migration merged.', 'The Sonic Field production migration completed independently through reviewed PRs. Its completion does not authorize indexing; do not turn indexing on merely because the visual migration merged.')
          replace_exact('docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md', '## 13. Definition of done for the complete migration\n\nThe migration is complete when:', '## 13. Definition of done for the complete migration — SATISFIED\n\nThe migration is complete. The checklist below is retained as the completion contract; final post-release accessibility/overflow and CI evidence is recorded in `docs/evidence/SONIC_FIELD_POST_RELEASE_CLOSURE_2026-09-02.md`.\n\nThe migration was considered complete when:')
          PY
      - name: Commit synchronized documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/04_VISUAL_SYSTEM.md docs/12_DECISIONS_AND_BOUNDARIES.md docs/21_SONIC_FIELD_PRODUCTION_MIGRATION.md
          git diff --cached --check
          git commit -m 'docs: close Sonic Field migration source of truth'
          git push origin HEAD:docs/sonic-field-closure
