name: Temporary Sonic Field production layout check

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-headphone-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Compact production viewport budget
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path_name}: {old[:90]!r}')
              path.write_text(text.replace(old, new, 1))

          replace(
              'src/components/layout/ToolShell.astro',
              '''  .tool-shell {\n    padding: clamp(16px, 2.2vw, 28px) 0 72px;\n  }\n\n  .tool-shell__header {\n    max-width: 900px;\n    margin-bottom: clamp(14px, 1.8vw, 22px);\n  }\n\n  .tool-shell__header .eyebrow {\n    margin-bottom: 8px;\n    color: #2b6971;\n  }\n\n  .tool-shell__header h1 {\n    max-width: 900px;\n    font-size: clamp(2.25rem, 4vw, 3rem);\n    line-height: 0.98;\n  }\n\n  .tool-shell__lede {\n    max-width: 780px;\n    margin: 9px 0 0;\n    color: var(--color-ink-muted);\n    font-size: clamp(0.92rem, 1.15vw, 1.03rem);\n    line-height: 1.48;\n  }''',
              '''  .tool-shell {\n    padding: clamp(8px, 1.35vw, 16px) 0 72px;\n  }\n\n  .tool-shell__header {\n    max-width: 900px;\n    margin-bottom: clamp(10px, 1.1vw, 14px);\n  }\n\n  .tool-shell__header .eyebrow {\n    margin-bottom: 5px;\n    color: #2b6971;\n    font-size: 0.74rem;\n  }\n\n  .tool-shell__header h1 {\n    max-width: 900px;\n    font-size: clamp(2.25rem, 3.2vw, 2.75rem);\n    line-height: 1;\n  }\n\n  .tool-shell__lede {\n    max-width: 780px;\n    margin: 6px 0 0;\n    color: var(--color-ink-muted);\n    font-size: clamp(0.9rem, 1vw, 0.98rem);\n    line-height: 1.42;\n  }'''
          )

          replace(
              'src/styles/global.css',
              '''.site-header {\n  padding: 20px 0;\n}\n''',
              '''.site-header {\n  padding: 20px 0;\n}\n\nbody:has(.tool-shell) .site-header {\n  padding-block: 10px;\n}\n'''
          )

          headphone = '''\n  @media (min-width: 701px) and (max-height: 820px) {\n    .headphone-sheet__bar {\n      min-height: 42px;\n      padding: 4px 16px;\n    }\n\n    .headphone-field {\n      gap: 6px;\n      min-height: 218px;\n      padding: 9px 18px 8px;\n    }\n\n    .headphone-stage {\n      min-height: clamp(100px, 14dvh, 116px);\n    }\n\n    .headphone-stage__bridge {\n      height: 58px;\n    }\n\n    .headphone-node {\n      min-height: 88px;\n      padding-block: 7px;\n    }\n\n    .headphone-node__driver {\n      width: 40px;\n      height: 40px;\n    }\n\n    .headphone-rail {\n      min-height: 156px;\n    }\n\n    .headphone-rail > * {\n      padding: 9px 12px;\n    }\n\n    .headphone-mode-slot {\n      min-height: 154px;\n    }\n\n    .headphone-channel-hint,\n    .headphone-panel {\n      inset: 9px 12px;\n      gap: 5px;\n    }\n\n    .headphone-field-input input {\n      min-height: 34px;\n    }\n\n    .headphone-state-strip {\n      padding: 6px 16px;\n    }\n\n    .headphone-state-strip p,\n    .headphone-error {\n      font-size: 0.68rem;\n      line-height: 1.3;\n    }\n  }\n'''
          replace(
              'src/tools/headphone-test/HeadphoneTest.astro',
              '''\n  @media (max-width: 900px) {''',
              headphone + '''\n  @media (max-width: 900px) {'''
          )

          hearing = '''\n  @media (min-width: 981px) and (max-height: 820px) {\n    .hearing-sheet__bar {\n      min-height: 42px;\n      padding: 4px 16px;\n    }\n\n    .hearing-field {\n      grid-template-rows: auto minmax(88px, 1fr) auto;\n      gap: 6px 14px;\n      min-height: 220px;\n      padding: 9px 16px 8px;\n    }\n\n    .hearing-current,\n    .hearing-observation {\n      padding: 9px;\n    }\n\n    .hearing-current strong {\n      font-size: clamp(1.8rem, 3.2vw, 2.8rem);\n    }\n\n    .hearing-frequency-path {\n      min-height: 88px;\n    }\n\n    .hearing-decision-slot {\n      min-height: 62px;\n    }\n\n    .hearing-answer,\n    .hearing-decision-placeholder {\n      inset: 6px 0 0;\n    }\n\n    .hearing-rail {\n      min-height: 158px;\n    }\n\n    .hearing-rail > * {\n      padding: 9px 12px;\n    }\n\n    .hearing-setup {\n      gap: 5px;\n    }\n\n    .hearing-setup__copy {\n      display: none;\n    }\n\n    .hearing-setup__status,\n    .hearing-mode-note,\n    .hearing-manual-status {\n      font-size: 0.66rem;\n      line-height: 1.28;\n    }\n\n    .hearing-confirm {\n      font-size: 0.64rem;\n      line-height: 1.24;\n    }\n\n    .hearing-mode-control {\n      gap: 10px;\n    }\n\n    .hearing-mode-slot {\n      min-height: 158px;\n    }\n\n    .hearing-mode-slot > section {\n      inset: 9px 12px;\n      gap: 6px;\n    }\n\n    .hearing-safety-strip {\n      padding: 6px 16px;\n    }\n\n    .hearing-safety-strip p,\n    .hearing-error {\n      font-size: 0.68rem;\n      line-height: 1.3;\n    }\n  }\n'''
          replace(
              'src/tools/hearing-frequency/HearingFrequency.astro',
              '''\n  @media (max-width: 980px) {''',
              hearing + '''\n  @media (max-width: 980px) {'''
          )

          spectrum = '''\n  @media (min-width: 981px) and (max-height: 920px) {\n    .spectrum-sheet__bar {\n      min-height: 44px;\n      padding-block: 4px;\n    }\n\n    .spectrum-field {\n      gap: 7px;\n      min-height: 292px;\n      padding-block: 10px 9px;\n    }\n\n    .spectrum-canvas-wrap {\n      min-height: 196px;\n    }\n\n    .spectrum-rail {\n      min-height: 142px;\n    }\n\n    .spectrum-state-strip,\n    .spectrum-claim-note {\n      padding-block: 6px;\n    }\n  }\n'''
          replace(
              'src/tools/spectrum-analyzer/SpectrumAnalyzer.astro',
              '''\n  @media (max-width: 980px) {''',
              spectrum + '''\n  @media (max-width: 980px) {'''
          )
          PY
      - name: Format production changes
        run: |
          pnpm exec prettier --write \
            src/components/layout/ToolShell.astro \
            src/styles/global.css \
            src/tools/headphone-test/HeadphoneTest.astro \
            src/tools/hearing-frequency/HearingFrequency.astro \
            src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
      - name: Commit compact viewport budget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/ToolShell.astro src/styles/global.css src/tools/headphone-test/HeadphoneTest.astro src/tools/hearing-frequency/HearingFrequency.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
          git commit -m "fix: fit Sonic Field stress tools in desktop viewports"
          git push
      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          pnpm check
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Existing stress-trio behavior regressions
        run: |
          pnpm exec playwright test \
            tests/browser/headphone-test.spec.ts \
            tests/browser/headphone-layout.spec.ts \
            tests/browser/spectrum-analyzer.spec.ts \
            tests/browser/spectrum-analyzer-layout.spec.ts \
            tests/browser/hearing-frequency.spec.ts \
            tests/browser/hearing-frequency-layout.spec.ts \
            tests/browser/hearing-frequency-stop-boundary.spec.ts \
            --project=chromium
      - name: Sonic Field production layout gates
        run: pnpm exec playwright test tests/browser/sonic-field-production-layout.spec.ts --project=chromium
