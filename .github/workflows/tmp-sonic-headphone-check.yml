name: Temporary Sonic Field cross-engine QA

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-headphone-check.yml

permissions:
  contents: read

jobs:
  cross-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps firefox webkit
      - name: Firefox stress-trio layout contracts
        run: |
          pnpm exec playwright test \
            tests/browser/headphone-layout.spec.ts \
            tests/browser/spectrum-analyzer-layout.spec.ts \
            tests/browser/hearing-frequency-layout.spec.ts \
            tests/browser/sonic-field-production-layout.spec.ts \
            --project=firefox
      - name: WebKit stress-trio layout contracts
        run: |
          pnpm exec playwright test \
            tests/browser/headphone-layout.spec.ts \
            tests/browser/spectrum-analyzer-layout.spec.ts \
            tests/browser/hearing-frequency-layout.spec.ts \
            tests/browser/sonic-field-production-layout.spec.ts \
            --project=webkit
