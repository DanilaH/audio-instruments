name: Temporary Sonic Field production layout check

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-headphone-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Replace superseded purple focus token
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/global.css')
          text = path.read_text()
          old = '--color-focus: #5d4ae8;'
          new = '--color-focus: #0a6570;'
          if old not in text:
              raise SystemExit('expected legacy purple focus token not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed production sources and tests
        run: |
          pnpm exec prettier --write \
            src/styles/global.css \
            tests/browser/hearing-frequency-layout.spec.ts \
            tests/browser/sonic-field-production-layout.spec.ts
      - name: Commit deterministic cleanup if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/styles/global.css tests/browser/hearing-frequency-layout.spec.ts tests/browser/sonic-field-production-layout.spec.ts
            git commit -m "style: finalize Sonic Field foundation tokens"
            git push
          fi
      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          pnpm check
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Existing stress-trio behavior regressions
        run: |
          pnpm exec playwright test \
            tests/browser/headphone-test.spec.ts \
            tests/browser/headphone-layout.spec.ts \
            tests/browser/spectrum-analyzer.spec.ts \
            tests/browser/spectrum-analyzer-layout.spec.ts \
            tests/browser/hearing-frequency.spec.ts \
            tests/browser/hearing-frequency-layout.spec.ts \
            tests/browser/hearing-frequency-stop-boundary.spec.ts \
            --project=chromium
      - name: Sonic Field production layout gates
        run: pnpm exec playwright test tests/browser/sonic-field-production-layout.spec.ts --project=chromium
