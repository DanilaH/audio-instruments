name: Temporary Sonic Field production layout check

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-headphone-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Trim Spectrum compact status bar
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tools/spectrum-analyzer/SpectrumAnalyzer.astro')
          text = path.read_text()
          old = '''    .spectrum-sheet__bar {\n      min-height: 44px;\n      padding-block: 4px;\n    }'''
          new = '''    .spectrum-sheet__bar {\n      min-height: 40px;\n      padding-block: 3px;\n    }'''
          if old not in text:
              raise SystemExit('expected compact Spectrum status bar not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
      - name: Commit final Spectrum viewport fit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
          git commit -m "fix: finish Spectrum compact viewport fit"
          git push
      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          pnpm check
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Spectrum behavior regression
        run: |
          pnpm exec playwright test \
            tests/browser/spectrum-analyzer.spec.ts \
            tests/browser/spectrum-analyzer-layout.spec.ts \
            --project=chromium
      - name: Sonic Field production layout gates
        run: pnpm exec playwright test tests/browser/sonic-field-production-layout.spec.ts --project=chromium
