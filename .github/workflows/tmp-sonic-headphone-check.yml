name: Temporary Sonic Field stress-trio check

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-headphone-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format stress-trio sources
        run: |
          pnpm exec prettier --write \
            src/components/layout/ToolShell.astro \
            src/components/layout/SonicInstrument.astro \
            src/components/feedback/ToolStatus.astro \
            src/components/feedback/CapabilityNotice.astro \
            src/components/controls/LevelControl.astro \
            src/components/controls/ModePills.astro \
            src/tools/headphone-test/HeadphoneTest.astro \
            src/tools/spectrum-analyzer/SpectrumAnalyzer.astro \
            src/tools/hearing-frequency/HearingFrequency.astro
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components src/tools/headphone-test/HeadphoneTest.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro src/tools/hearing-frequency/HearingFrequency.astro
            git commit -m "style: format Sonic Field stress trio"
            git push
          fi
      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          pnpm check
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Stress-trio browser regression
        run: |
          pnpm exec playwright test \
            tests/browser/headphone-test.spec.ts \
            tests/browser/headphone-layout.spec.ts \
            tests/browser/spectrum-analyzer.spec.ts \
            tests/browser/spectrum-analyzer-layout.spec.ts \
            tests/browser/hearing-frequency.spec.ts \
            tests/browser/hearing-frequency-layout.spec.ts \
            tests/browser/hearing-frequency-stop-boundary.spec.ts \
            --project=chromium
