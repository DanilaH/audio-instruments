name: TEMP Final Browser Fixes

on:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci-approved') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target repair branch
        uses: actions/checkout@v7
        with:
          ref: p8-cross-browser-matrix-repair
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact residual browser-test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/browser/hearing-frequency.spec.ts"): [
                  (
                      '  await expect(unavailableOptions.nth(0)).toHaveValue("16000");\n'
                      '  await expect(unavailableOptions.nth(1)).toHaveValue("18000");\n'
                      '  await expect(unavailableOptions.nth(2)).toHaveValue("20000");',
                      '  await expect(unavailableOptions.nth(0)).toHaveAttribute("value", "16000");\n'
                      '  await expect(unavailableOptions.nth(1)).toHaveAttribute("value", "18000");\n'
                      '  await expect(unavailableOptions.nth(2)).toHaveAttribute("value", "20000");',
                  ),
              ],
              Path("tests/browser/hearing-frequency-stop-boundary.spec.ts"): [
                  (
                      '  await page.locator(\'input[name="hearing-mode"][value="manual"]\').check();',
                      '  await page\n'
                      '    .locator("label.mode-pill")\n'
                      '    .filter({ hasText: "Manual" })\n'
                      '    .click();',
                  ),
              ],
              Path("tests/browser/surround-test.spec.ts"): [
                  (
                      '  await page.getByRole("button", { name: "Left", exact: true }).click();\n'
                      '  expect(await readCount(page, "__surroundContextCount")).toBe(2);\n'
                      '  await expect(capabilityCheck).toBeDisabled();\n'
                      '  await page.getByRole("button", { name: "Stop" }).click();\n'
                      '  await expect(capabilityCheck).toBeEnabled();',
                      '  await page.getByRole("button", { name: "Left", exact: true }).click();\n'
                      '  const activeState = await page.evaluate(() => ({\n'
                      '    status: document.querySelector("#surround-status [data-status-label]")?.textContent,\n'
                      '    checkDisabled: (document.querySelector("[data-surround-check]") as HTMLButtonElement | null)?.disabled,\n'
                      '    stopDisabled: (document.querySelector("[data-surround-stop]") as HTMLButtonElement | null)?.disabled,\n'
                      '    contextCount: Number(Reflect.get(window, "__surroundContextCount") ?? 0),\n'
                      '  }));\n'
                      '  expect(activeState).toEqual({\n'
                      '    status: "Playing Left",\n'
                      '    checkDisabled: true,\n'
                      '    stopDisabled: false,\n'
                      '    contextCount: 2,\n'
                      '  });\n'
                      '  await page.getByRole("button", { name: "Stop" }).click();\n'
                      '  await expect(capabilityCheck).toBeEnabled();',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exact replacement once, found {count}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          pnpm exec prettier --write tests/browser/hearing-frequency.spec.ts tests/browser/hearing-frequency-stop-boundary.spec.ts tests/browser/surround-test.spec.ts
          pnpm format:check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run residual matrix across all engines
        run: |
          pnpm build
          pnpm exec playwright test tests/browser/hearing-frequency.spec.ts tests/browser/hearing-frequency-stop-boundary.spec.ts tests/browser/surround-test.spec.ts

      - name: Commit proven fixes to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/hearing-frequency.spec.ts tests/browser/hearing-frequency-stop-boundary.spec.ts tests/browser/surround-test.spec.ts
          git commit -m "P8: resolve residual cross-browser test races"
          git push origin HEAD:p8-cross-browser-matrix-repair
