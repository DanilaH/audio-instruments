name: TEMP Prettier Push

on:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci-approved') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repair branch
        uses: actions/checkout@v7
        with:
          ref: p8-cross-browser-matrix-repair
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize tracked formatter scope
        run: |
          pnpm exec prettier --write "src/**/*.{astro,css,js,mjs,ts}" "tests/**/*.{js,mjs,ts}" "scripts/**/*.{js,mjs,ts}" "playwright.config.ts" "vitest.config.ts" "eslint.config.mjs" ".prettierrc.mjs" "astro.config.ts" "pnpm-workspace.yaml" "package.json" "tsconfig.json"
          pnpm format:check

      - name: Commit normalization to repair branch
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts playwright.config.ts vitest.config.ts eslint.config.mjs .prettierrc.mjs astro.config.ts pnpm-workspace.yaml package.json tsconfig.json
          git commit -m "P8: normalize repository formatting"
          git push origin HEAD:p8-cross-browser-matrix-repair
