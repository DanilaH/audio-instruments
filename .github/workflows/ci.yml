name: TEMP Surround Recovery Probe

on:
  pull_request:
    types:
      - synchronize
      - labeled
      - reopened

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci-approved') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target repair branch
        uses: actions/checkout@v7
        with:
          ref: p8-cross-browser-matrix-repair

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject recovery-state diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/browser/surround-test.spec.ts")
          text = path.read_text()
          old = '''  await page.getByRole("button", { name: "Left", exact: true }).click();
  expect(await readCount(page, "__surroundContextCount")).toBe(2);
  await expect(capabilityCheck).toBeDisabled();
  await page.getByRole("button", { name: "Stop" }).click();
  await expect(capabilityCheck).toBeEnabled();'''
          new = '''  await page.getByRole("button", { name: "Left", exact: true }).click();
  const probeImmediately = await page.evaluate(() => ({
    status: document.querySelector("#surround-status [data-status-label]")?.textContent,
    error: document.querySelector("[data-surround-error]")?.textContent,
    errorHidden: (document.querySelector("[data-surround-error]") as HTMLElement | null)?.hidden,
    checkDisabled: (document.querySelector("[data-surround-check]") as HTMLButtonElement | null)?.disabled,
    stopDisabled: (document.querySelector("[data-surround-stop]") as HTMLButtonElement | null)?.disabled,
    contextCount: Number(Reflect.get(window, "__surroundContextCount") ?? 0),
    oscillatorCount: (Reflect.get(window, "__surroundOscillators") as unknown[] | undefined)?.length ?? 0,
  }));
  console.log("SURROUND_PROBE_IMMEDIATE", JSON.stringify(probeImmediately));
  await page.waitForTimeout(100);
  const probeAfter100 = await page.evaluate(() => ({
    status: document.querySelector("#surround-status [data-status-label]")?.textContent,
    error: document.querySelector("[data-surround-error]")?.textContent,
    errorHidden: (document.querySelector("[data-surround-error]") as HTMLElement | null)?.hidden,
    checkDisabled: (document.querySelector("[data-surround-check]") as HTMLButtonElement | null)?.disabled,
    stopDisabled: (document.querySelector("[data-surround-stop]") as HTMLButtonElement | null)?.disabled,
    contextCount: Number(Reflect.get(window, "__surroundContextCount") ?? 0),
    oscillatorCount: (Reflect.get(window, "__surroundOscillators") as unknown[] | undefined)?.length ?? 0,
  }));
  console.log("SURROUND_PROBE_100MS", JSON.stringify(probeAfter100));
  expect(probeAfter100.contextCount).toBe(2);'''
          if text.count(old) != 1:
              raise SystemExit(f"expected surround block once, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write tests/browser/surround-test.spec.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run surround recovery probe
        run: |
          pnpm build
          pnpm exec playwright test tests/browser/surround-test.spec.ts --grep "failed destination restoration closes the uncertain session before fresh stereo playback"
