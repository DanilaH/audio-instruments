name: P8 Analytics Post-Review Validation

on:
  push:
    branches:
      - feat/p8-cloudflare-analytics-readiness

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:analytics
      - run: pnpm test:indexing
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/shell.spec.ts --project=chromium
