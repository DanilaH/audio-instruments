name: PR4 Targeted Validation

on:
  push:
    branches:
      - feat/sonic-field-input-measurement-family

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sonic-field-input-measurement-family
          fetch-depth: 0

      - name: Patch legacy Decibel calibration interactions
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('tests/browser/decibel-meter.spec.ts'),
              Path('tests/browser/decibel-meter-session-calibration.spec.ts'),
          ]
          helper = '''\nasync function openDbCalibration(page: Page): Promise<void> {\n  const disclosure = page.locator("[data-db-calibration-disclosure]");\n  if ((await disclosure.getAttribute("open")) === null) {\n    await disclosure.locator("summary").click();\n  }\n}\n'''
          duplicate = (
              '  await openDbCalibration(page);\n'
              '  await openDbCalibration(page);\n'
          )

          def ensure_open_before(text: str, target: str) -> str:
              guarded = f'  await openDbCalibration(page);\n{target}'
              if guarded in text:
                  return text
              return text.replace(target, guarded)

          for path in files:
              text = path.read_text()
              while duplicate in text:
                  text = text.replace(duplicate, '  await openDbCalibration(page);\n')

              if 'async function openDbCalibration' not in text:
                  marker = '\nasync function '
                  index = text.find(marker)
                  if index == -1:
                      raise RuntimeError(f'No helper insertion point in {path}')
                  text = text[:index] + helper + text[index:]

              text = ensure_open_before(
                  text,
                  '  await page.locator("[data-db-reference]").fill(',
              )
              text = ensure_open_before(
                  text,
                  '  await page.locator("[data-db-calibrate]").click();',
              )
              path.write_text(text)
          PY

      - name: Setup pnpm and Node
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format PR4 files
        run: >-
          pnpm exec prettier --write
          src/tools/microphone-test/MicrophoneTest.astro
          src/tools/decibel-meter/DecibelMeter.astro
          src/tools/pitch-detector/PitchDetector.astro
          tests/browser/decibel-meter.spec.ts
          tests/browser/decibel-meter-session-calibration.spec.ts
          tests/browser/decibel-meter-calibration-disclosure.spec.ts
          tests/browser/sonic-field-input-measurement-production-layout.spec.ts
          tests/browser/tool-touch-targets.spec.ts

      - name: Lint PR4 files
        run: >-
          pnpm exec eslint
          src/tools/microphone-test/MicrophoneTest.astro
          src/tools/decibel-meter/DecibelMeter.astro
          src/tools/pitch-detector/PitchDetector.astro
          tests/browser/decibel-meter.spec.ts
          tests/browser/decibel-meter-session-calibration.spec.ts
          tests/browser/decibel-meter-calibration-disclosure.spec.ts
          tests/browser/sonic-field-input-measurement-production-layout.spec.ts
          tests/browser/tool-touch-targets.spec.ts

      - name: Commit remediation and formatting
        run: |
          if git diff --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tools/microphone-test/MicrophoneTest.astro \
            src/tools/decibel-meter/DecibelMeter.astro \
            src/tools/pitch-detector/PitchDetector.astro \
            tests/browser/decibel-meter.spec.ts \
            tests/browser/decibel-meter-session-calibration.spec.ts \
            tests/browser/decibel-meter-calibration-disclosure.spec.ts \
            tests/browser/sonic-field-input-measurement-production-layout.spec.ts \
            tests/browser/tool-touch-targets.spec.ts
          git commit -m "test: align PR4 measurement interaction contracts"
          git push origin HEAD:feat/sonic-field-input-measurement-family

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run PR4 browser matrix
        run: >-
          pnpm exec playwright test
          tests/browser/microphone-test.spec.ts
          tests/browser/microphone-test-layout.spec.ts
          tests/browser/microphone-test-construction-failure.spec.ts
          tests/browser/microphone-test-device-metadata.spec.ts
          tests/browser/microphone-test-devicechange.spec.ts
          tests/browser/microphone-test-metadata-delay.spec.ts
          tests/browser/microphone-test-permission.spec.ts
          tests/browser/decibel-meter.spec.ts
          tests/browser/decibel-meter-session-calibration.spec.ts
          tests/browser/decibel-meter-layout.spec.ts
          tests/browser/decibel-meter-calibration-disclosure.spec.ts
          tests/browser/pitch-detector.spec.ts
          tests/browser/pitch-detector-layout.spec.ts
          tests/browser/sonic-field-input-measurement-production-layout.spec.ts
          tests/browser/tool-touch-targets.spec.ts
          --project=chromium --project=firefox --project=webkit
