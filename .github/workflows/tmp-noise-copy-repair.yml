name: Temporary Noise Copy Repair

on:
  push:
    branches:
      - fix/runtime-layout-stability
    paths:
      - .github/workflows/tmp-noise-copy-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/runtime-layout-stability
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore required reminder copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/tools/noise-generator/NoiseGenerator.astro")
          text = path.read_text()
          old = "Long playback: keep device/headphone volume comfortable."
          new = "Long playback: keep device/headphone volume at a comfortable level."
          if old not in text:
              raise SystemExit("expected shortened reminder copy not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Static checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Targeted cross-browser regression suite
        run: |
          pnpm build
          pnpm exec playwright test \
            tests/browser/noise-generator-layout.spec.ts \
            tests/browser/noise-generator.spec.ts \
            tests/browser/runtime-layout-stability.spec.ts \
            --project=chromium --project=firefox --project=webkit

      - name: Commit verified repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-noise-copy-repair.yml
          git add src/tools/noise-generator/NoiseGenerator.astro
          git commit -m "fix: preserve required noise safety reminder"
          git push origin HEAD:fix/runtime-layout-stability
