name: Apply Sweep Endpoint To Audit

on:
  push:
    branches:
      - audit/post-sonic-field-release

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/post-sonic-field-release
      - name: Apply text-safe sweep endpoint color
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/tools/frequency-sweep/FrequencySweep.astro')
          text = path.read_text()
          old = "  .sweep-sheet__state strong {\n    display: inline-flex;\n    gap: 7px;\n    align-items: baseline;\n    color: var(--sonic-current);"
          new = "  .sweep-sheet__state strong {\n    display: inline-flex;\n    gap: 7px;\n    align-items: baseline;\n    color: var(--sonic-current-ink);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one sweep endpoint color anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit audit fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tools/frequency-sweep/FrequencySweep.astro
          git diff --cached --check
          git commit -m 'test: apply sweep endpoint contrast to audit fixture'
          git push origin HEAD:audit/post-sonic-field-release
