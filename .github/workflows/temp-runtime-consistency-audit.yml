name: Temporary runtime consistency audit

on:
  push:
    branches:
      - audit/runtime-consistency-2026-09-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - name: Apply staged consistency fixes
        run: |
          python scripts/temp-runtime-consistency-fixes.py
          python scripts/temp-audio-latency-layout-fix.py
      - name: Format staged product changes
        run: |
          pnpm exec prettier --write \
            src/tools/speaker-test/SpeakerTest.astro \
            src/tools/headphone-test/HeadphoneTest.astro \
            src/tools/bass-test/BassTest.astro \
            src/tools/noise-generator/NoiseGenerator.astro \
            src/tools/frequency-sweep/FrequencySweep.astro \
            src/tools/spectrum-analyzer/SpectrumAnalyzer.astro \
            src/tools/audio-latency/AudioLatency.astro
      - run: git diff --check
      - run: pnpm check
      - run: pnpm build
      - run: node scripts/runtime-wiring-audit.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run geometry and interaction audit
        run: pnpm exec playwright test tests/browser/runtime-consistency-audit.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Collect Audio Latency 320 delta
        if: ${{ always() }}
        run: pnpm exec playwright test tests/browser/runtime-latency-delta-collector.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Collect exact mode deltas
        if: ${{ always() }}
        run: pnpm exec playwright test tests/browser/runtime-mode-delta-collector.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Upload audit output
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-consistency-audit-${{ github.run_id }}
          path: |
            audit-output
            test-results
            src/tools/speaker-test/SpeakerTest.astro
            src/tools/headphone-test/HeadphoneTest.astro
            src/tools/bass-test/BassTest.astro
            src/tools/noise-generator/NoiseGenerator.astro
            src/tools/frequency-sweep/FrequencySweep.astro
            src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
            src/tools/audio-latency/AudioLatency.astro
          if-no-files-found: error
          retention-days: 7
