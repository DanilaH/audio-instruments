name: Temporary Sonic Field v3.1 render

on:
  push:
    branches:
      - prototype/audio-identity-v3-sonic-field
    paths:
      - .github/workflows/tmp-sonic-field-v3-1-render.yml
      - src/components/prototypes/SonicFieldCompactV31.astro

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Validate prototype source
        run: |
          pnpm exec prettier --check src/components/prototypes/SonicFieldCompactV31.astro src/pages/prototypes/audio-identity-v3/*.astro docs/16_AUDIO_IDENTITY_V3_SONIC_FIELD.md
          git diff --check
          pnpm check
          pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - name: Enforce viewport budget and capture screenshots
        run: |
          mkdir -p sonic-field-v3-1-renders
          cat > tests/browser/tmp-sonic-field-v3-1.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          import { writeFileSync } from "node:fs";

          const tools = ["headphone", "spectrum", "hearing"] as const;
          const viewports = [
            { width: 1366, height: 768, kind: "desktop" },
            { width: 1440, height: 900, kind: "desktop" },
            { width: 390, height: 844, kind: "mobile" },
          ] as const;
          const metrics: Record<string, unknown>[] = [];

          for (const tool of tools) {
            for (const viewport of viewports) {
              test(`${tool}-${viewport.width}x${viewport.height}`, async ({ page }) => {
                await page.setViewportSize(viewport);
                await page.goto(`/prototypes/audio-identity-v3/${tool}`);

                const result = await page.evaluate(() => {
                  const sheet = document.querySelector<HTMLElement>(".sheet")!;
                  const canvas = document.querySelector<HTMLElement>(".canvas")!;
                  const action = document.querySelector<HTMLElement>(".action-group");
                  const sr = sheet.getBoundingClientRect();
                  const cr = canvas.getBoundingClientRect();
                  const ar = action?.getBoundingClientRect();
                  return {
                    bodyScrollWidth: document.documentElement.scrollWidth,
                    sheetTop: Number(sr.top.toFixed(2)),
                    sheetBottom: Number(sr.bottom.toFixed(2)),
                    sheetHeight: Number(sr.height.toFixed(2)),
                    bottomAir: Number((innerHeight - sr.bottom).toFixed(2)),
                    canvasTop: Number(cr.top.toFixed(2)),
                    canvasBottom: Number(cr.bottom.toFixed(2)),
                    canvasHeight: Number(cr.height.toFixed(2)),
                    actionTop: ar ? Number(ar.top.toFixed(2)) : null,
                    canvasToAction: ar ? Number((ar.top - cr.bottom).toFixed(2)) : null,
                  };
                });

                metrics.push({ tool, viewport: `${viewport.width}x${viewport.height}`, kind: viewport.kind, ...result });

                await page.screenshot({
                  path: `sonic-field-v3-1-renders/${tool}-${viewport.width}x${viewport.height}.png`,
                  fullPage: false,
                });

                expect(result.bodyScrollWidth).toBeLessThanOrEqual(viewport.width + 1);
                if (viewport.kind === "desktop") {
                  expect(result.sheetTop).toBeLessThan(175);
                  expect(result.bottomAir).toBeGreaterThanOrEqual(24);
                } else {
                  expect(result.sheetTop).toBeLessThan(210);
                  if (result.canvasToAction !== null) {
                    expect(result.canvasToAction).toBeLessThanOrEqual(190);
                  }
                }
              });
            }
          }

          test.afterAll(() => {
            writeFileSync("sonic-field-v3-1-renders/metrics.json", JSON.stringify(metrics, null, 2));
          });
          EOF

          pnpm exec playwright test tests/browser/tmp-sonic-field-v3-1.spec.ts --project=chromium --workers=1 --reporter=line
          rm tests/browser/tmp-sonic-field-v3-1.spec.ts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonic-field-v3-1-renders-${{ github.run_id }}
          path: sonic-field-v3-1-renders
          if-no-files-found: error
          retention-days: 14
