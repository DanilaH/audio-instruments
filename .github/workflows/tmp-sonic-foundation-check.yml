name: Temporary Sonic Field foundation check

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-foundation-check.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate foundation checkpoint
        run: |
          pnpm exec prettier --check src/components/layout/ToolShell.astro src/components/layout/SonicInstrument.astro
          git diff --check origin/main...HEAD
          pnpm check
          pnpm build
