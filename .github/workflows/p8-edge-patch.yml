name: P8 Edge Patch

on:
  push:
    branches:
      - test/p8-edge-smoke

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/p8-edge-smoke
      - name: Patch Headphone mobile state reservation
        run: python -c "from pathlib import Path; p=Path('src/tools/headphone-test/HeadphoneTest.astro'); s=p.read_text(); old='    .headphone-sheet__state strong {\n      white-space: normal;\n    }'; new='    .headphone-sheet__state strong {\n      min-height: 2.4em;\n      line-height: 1.2;\n      white-space: normal;\n    }'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
      - name: Patch Bass mobile mode reservation
        run: python -c "from pathlib import Path; p=Path('src/tools/bass-test/BassTest.astro'); s=p.read_text(); old='min-height: 237px;'; assert s.count(old)==2; p.write_text(s.replace(old,'min-height: 240px;'))"
      - name: Patch Spectrum compact desktop height
        run: python -c "from pathlib import Path; p=Path('src/tools/spectrum-analyzer/SpectrumAnalyzer.astro'); s=p.read_text(); m='  @media (max-width: 980px) {'; n='  @media (min-width: 981px) and (max-height: 740px) {\n    .spectrum-field {\n      min-height: 280px;\n      padding-block: 8px 7px;\n    }\n\n    .spectrum-canvas-wrap {\n      min-height: 180px;\n    }\n  }\n\n'+m; assert s.count(m)==1; p.write_text(s.replace(m,n,1))"
      - name: Patch Surround compact desktop height
        run: python -c "from pathlib import Path; p=Path('src/tools/surround-sound-test/SurroundSoundTest.astro'); s=p.read_text(); m='  @media (max-width: 1040px) {'; n='  @media (min-width: 981px) and (max-height: 740px) {\n    .surround-field {\n      min-height: 242px;\n      padding-block: 8px 7px;\n    }\n\n    .surround-stage {\n      height: 160px;\n      min-height: 160px;\n    }\n  }\n\n'+m; assert s.count(m)==1; p.write_text(s.replace(m,n,1))"
      - run: git diff --check
      - name: Commit Edge geometry fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/headphone-test/HeadphoneTest.astro src/tools/bass-test/BassTest.astro src/tools/spectrum-analyzer/SpectrumAnalyzer.astro src/tools/surround-sound-test/SurroundSoundTest.astro
          git commit -m "fix: stabilize layouts in Microsoft Edge"
          git push
