name: P8 VPS Caddy Targeted

on:
  push:
    branches:
      - feat/p8-vps-caddy-deploy-contract

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:deploy-contract
      - run: pnpm test:live-release-contract
      - run: pnpm test:analytics
      - run: pnpm test:indexing
      - name: Build fail-closed static release
        run: SITE_INDEXING=disabled SITE_ANALYTICS=disabled pnpm build
      - name: Validate Caddy 2.11.4 config and extensionless route serving
        run: |
          docker run --rm \
            -e SITE_DOMAIN=:8080 \
            -e SITE_ROOT=/srv/browser-audio-lab/current \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker run -d --name browser-audio-lab-caddy \
            -p 127.0.0.1:8080:8080 \
            -e SITE_DOMAIN=:8080 \
            -e SITE_ROOT=/srv/browser-audio-lab/current \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/dist:/srv/browser-audio-lab/current:ro" \
            caddy:2.11.4-alpine

          trap 'docker rm -f browser-audio-lab-caddy >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' http://127.0.0.1:8080/sound-test)"

          test "$status" = "200"
          ! grep -qi '^location:' "$headers"
          grep -q '<html' "$body"
