name: Sonic Contrast Remediation

on:
  push:
    branches:
      - fix/sonic-field-muted-contrast

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sonic-field-muted-contrast
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
      - run: pnpm install --frozen-lockfile
      - name: Apply shared text-safe current token
        run: |
          python - <<'PY'
          from pathlib import Path

          shared = Path('src/components/layout/SonicInstrument.astro')
          text = shared.read_text()
          anchor = '    --sonic-current: #b37b1f;\n'
          addition = anchor + '    --sonic-current-ink: #87540a;\n'
          if text.count(anchor) != 1 or '--sonic-current-ink:' in text:
              raise SystemExit('unexpected Sonic current token anchor')
          shared.write_text(text.replace(anchor, addition, 1))

          targets = {
              'src/tools/speaker-test/SpeakerTest.astro': 'speaker-state-strip',
              'src/tools/headphone-test/HeadphoneTest.astro': 'headphone-state-strip',
              'src/tools/stereo-test/StereoTest.astro': 'stereo-state-strip',
              'src/tools/phase-test/PhaseTest.astro': 'phase-state-strip',
              'src/tools/surround-sound-test/SurroundSoundTest.astro': 'surround-state-strip',
              'src/tools/tone-generator/ToneGenerator.astro': 'tone-state-strip',
              'src/tools/frequency-sweep/FrequencySweep.astro': 'sweep-state-strip',
              'src/tools/audio-latency/AudioLatency.astro': 'latency-safety-strip',
              'src/tools/hearing-frequency/HearingFrequency.astro': 'hearing-safety-strip',
          }
          for filename, class_name in targets.items():
              path = Path(filename)
              text = path.read_text()
              old = f'.{class_name} strong {{\n    color: var(--sonic-current);'
              new = f'.{class_name} strong {{\n    color: var(--sonic-current-ink);'
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected one current-text anchor, got {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write src/components/layout/SonicInstrument.astro src/tools/speaker-test/SpeakerTest.astro src/tools/headphone-test/HeadphoneTest.astro src/tools/stereo-test/StereoTest.astro src/tools/phase-test/PhaseTest.astro src/tools/surround-sound-test/SurroundSoundTest.astro src/tools/tone-generator/ToneGenerator.astro src/tools/frequency-sweep/FrequencySweep.astro src/tools/audio-latency/AudioLatency.astro src/tools/hearing-frequency/HearingFrequency.astro
      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layout/SonicInstrument.astro src/tools/speaker-test/SpeakerTest.astro src/tools/headphone-test/HeadphoneTest.astro src/tools/stereo-test/StereoTest.astro src/tools/phase-test/PhaseTest.astro src/tools/surround-sound-test/SurroundSoundTest.astro src/tools/tone-generator/ToneGenerator.astro src/tools/frequency-sweep/FrequencySweep.astro src/tools/audio-latency/AudioLatency.astro src/tools/hearing-frequency/HearingFrequency.astro
          git diff --cached --check
          git commit -m 'fix: separate Sonic current text contrast'
          git push origin HEAD:fix/sonic-field-muted-contrast
