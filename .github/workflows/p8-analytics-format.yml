name: P8 Analytics Format Remediation

on:
  push:
    branches:
      - feat/p8-cloudflare-analytics-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p8-cloudflare-analytics-readiness
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier only
        run: |
          pnpm exec prettier --write \
            src/config/site-analytics.ts \
            tests/unit/site-analytics.test.ts \
            src/layouts/BaseLayout.astro \
            src/pages/privacy.astro \
            src/env.d.ts \
            scripts/verify-analytics-build.mjs \
            package.json
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts package.json
          git commit -m "style: format P8 analytics readiness"
          git push
