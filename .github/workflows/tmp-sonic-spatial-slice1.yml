name: Temporary Sonic Field spatial slice 1

on:
  push:
    branches:
      - feat/sonic-field-spatial-output-family
    paths:
      - .github/workflows/tmp-sonic-spatial-slice1.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Speaker and Stereo Sonic Field migration
        run: python .github/tmp-sonic-spatial-slice1.py
      - run: pnpm exec prettier --write src/tools/speaker-test/SpeakerTest.astro src/tools/speaker-test/SpeakerTestController.ts src/tools/stereo-test/StereoTest.astro src/tools/stereo-test/StereoTestController.ts tests/browser/speaker-layout.spec.ts tests/browser/stereo-phase-layout.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify Speaker and Stereo migration
        run: pnpm exec playwright test tests/browser/speaker-layout.spec.ts tests/browser/speaker-test.spec.ts tests/browser/stereo-phase-layout.spec.ts tests/browser/stereo-phase.spec.ts --project=chromium --project=firefox --project=webkit
      - name: Commit verified spatial slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/speaker-test/SpeakerTest.astro src/tools/speaker-test/SpeakerTestController.ts src/tools/stereo-test/StereoTest.astro src/tools/stereo-test/StereoTestController.ts tests/browser/speaker-layout.spec.ts tests/browser/stereo-phase-layout.spec.ts
          git commit -m "feat: migrate Speaker and Stereo to Sonic Field"
          git push origin HEAD:feat/sonic-field-spatial-output-family
