name: Temporary Sonic Field spatial slice 2 retry

on:
  push:
    branches:
      - feat/sonic-field-spatial-output-family
    paths:
      - .github/workflows/tmp-sonic-spatial-slice1.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Surround and Phase Sonic Field migration
        run: python .github/tmp-sonic-spatial-slice1.py
      - name: Align Phase perceptual test with controller lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/browser/stereo-phase-layout.spec.ts")
          text = path.read_text()
          pattern = re.compile(
              r'''await page\.getByRole\("button", \{ name: "In phase" \}\)\.click\(\);\s*'''
              r'''const inPhase = await stage\.boundingBox\(\);\s*'''
              r'''await page\.getByRole\("button", \{ name: "Inverted" \}\)\.click\(\);'''
          )
          replacement = '''await page.getByRole("button", { name: "In phase" }).click();
            const inPhase = await stage.boundingBox();
            const invertedButton = page.getByRole("button", { name: "Inverted" });
            await expect(invertedButton).toBeEnabled();
            await invertedButton.click();'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Phase perceptual sequencing match count: {count}")
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write src/tools/surround-sound-test/SurroundSoundTest.astro src/tools/phase-test/PhaseTest.astro tests/browser/surround-layout.spec.ts tests/browser/stereo-phase-layout.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify Surround and Phase migration
        run: pnpm exec playwright test tests/browser/surround-layout.spec.ts tests/browser/surround-test.spec.ts tests/browser/stereo-phase-layout.spec.ts tests/browser/stereo-phase.spec.ts --project=chromium --project=firefox --project=webkit
      - name: Commit verified spatial slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/surround-sound-test/SurroundSoundTest.astro src/tools/phase-test/PhaseTest.astro tests/browser/surround-layout.spec.ts tests/browser/stereo-phase-layout.spec.ts
          git commit -m "feat: migrate Surround and Phase to Sonic Field"
          git push origin HEAD:feat/sonic-field-spatial-output-family
