  [data-stereo-visual="right-to-left"] .stereo-track__signal,
  [data-stereo-visual="right-to-left"] .stereo-track__trail { animation: stereo-right-to-left 4s linear both; }
  [data-stereo-visual*="to"] .stereo-track__trail { opacity: 1; }
  [data-stereo-visual*="to"] .stereo-track__trail--one { animation-delay: 0.08s; opacity: 0.48; }
  [data-stereo-visual*="to"] .stereo-track__trail--two { animation-delay: 0.16s; opacity: 0.22; }
  [data-stereo-visual="return-from-right"] .stereo-track__signal { animation: stereo-return-right 240ms ease-out both; }
  [data-stereo-visual="return-from-left"] .stereo-track__signal { animation: stereo-return-left 240ms ease-out both; }
  @keyframes stereo-left-to-right { from { left: 7%; } to { left: 93%; } }
  @keyframes stereo-right-to-left { from { left: 93%; } to { left: 7%; } }
  @keyframes stereo-return-right { from { left: 93%; } to { left: 50%; } }
  @keyframes stereo-return-left { from { left: 7%; } to { left: 50%; } }
  .stereo-field__note { margin: 0; color: var(--sonic-muted); font-size: 0.71rem; line-height: 1.35; }
  .stereo-rail { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(260px, 0.9fr) 120px; min-height: 132px; border-bottom: 1px solid var(--sonic-border-soft); }
  .stereo-rail > * { min-width: 0; padding: 14px 16px; }
  .stereo-rail > * + * { border-left: 1px solid var(--sonic-border-soft); }
  .stereo-pan-copy { display: grid; align-content: center; gap: 2px; }
  .stereo-pan-copy strong { font-size: 0.86rem; }
  .stereo-pan-copy p { margin: 0; color: var(--sonic-muted); font-size: 0.7rem; line-height: 1.35; }
  .stereo-pan-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: center; gap: 8px; }
  .stereo-pan-actions button, .stereo-stop { min-height: 44px; border: 1px solid var(--sonic-border); border-radius: 5px; background: transparent; color: var(--sonic-ink); font-weight: 800; cursor: pointer; }
  .stereo-pan-actions button[aria-pressed="true"] { border-color: var(--sonic-signal); background: rgb(39 127 138 / 0.07); color: #0b6570; }
  .stereo-stop { align-self: center; margin: 14px; padding: 0 10px; }
  .transport-stop-shape { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 1px; background: currentColor; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  .stereo-state-strip { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 8px 18px; color: var(--sonic-muted); }
  .stereo-state-strip strong { color: var(--sonic-current); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .stereo-state-strip p, .stereo-error { margin: 0; font-size: 0.7rem; line-height: 1.35; }
  .stereo-error { padding: 8px 18px 10px; color: var(--sonic-opposing); }
  .stereo-error[hidden] { display: none; }
  @media (min-width: 981px) and (max-height: 920px) {
    .stereo-field { min-height: 222px; padding-block: 12px 10px; }
    .stereo-track { min-height: 118px; }
    .stereo-rail { min-height: 112px; }
    .stereo-rail > * { padding-block: 10px; }
  }
  @media (max-width: 760px) {
    .stereo-sheet__bar { padding-inline: 14px; }
    .stereo-field { min-height: 224px; padding: 13px 14px 11px; }
    .stereo-field__reference { display: none; }
    .stereo-track { min-height: 126px; }
    .stereo-track__target { min-width: 66px; padding-inline: 8px; }
    .stereo-rail { grid-template-columns: 1fr; }
    .stereo-rail > * + * { border-left: 0; border-top: 1px solid var(--sonic-border-soft); }
    .stereo-state-strip { grid-template-columns: 1fr; gap: 4px; padding-inline: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stereo-track__signal, .stereo-track__trail { animation: none !important; transition: none; }
    [data-stereo-visual="left-to-right"] .stereo-track__signal,
    [data-stereo-visual="right-to-left"] .stereo-track__signal,
    [data-stereo-visual="return-from-right"] .stereo-track__signal,
    [data-stereo-visual="return-from-left"] .stereo-track__signal { left: 50%; }
    .stereo-track__trail { display: none; }
  }
</style>
'''

          replace_component(
              'src/tools/speaker-test/SpeakerTest.astro',
              '<div data-speaker-test',
              'import InstrumentSurface from "../../components/layout/InstrumentSurface.astro";',
              'import SonicInstrument from "../../components/layout/SonicInstrument.astro";',
