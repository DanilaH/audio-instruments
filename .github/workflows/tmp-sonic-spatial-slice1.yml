          )

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          speaker_controller = Path('src/tools/speaker-test/SpeakerTestController.ts')
          text = speaker_controller.read_text()
          old = '''  #setVisual(state: SpeakerVisualState, label: string): void {\n    this.#root.dataset.speakerVisual = state;\n    this.#visualLabel.textContent = label;\n  }'''
          new = '''  #setVisual(state: SpeakerVisualState, label: string): void {\n    this.#root.dataset.speakerVisual = state;\n    this.#visualLabel.textContent = label;\n    for (const button of this.#channelButtons) {\n      button.setAttribute(\n        "aria-pressed",\n        String(button.dataset.speakerChannel === state),\n      );\n    }\n  }'''
          speaker_controller.write_text(replace_once(text, old, new, 'speaker visual state'))

          stereo_controller = Path('src/tools/stereo-test/StereoTestController.ts')
          text = stereo_controller.read_text()
          text = replace_once(text, 'const PAN_SWEEP_SECONDS = 4;', 'const PAN_SWEEP_SECONDS = 4;\nconst PAN_RETURN_MS = 240;', 'stereo return constant')
          text = replace_once(
              text,
              '''  #finishTimer: number | null = null;\n  #starting = false;''',
              '''  #finishTimer: number | null = null;\n  #returnTimer: number | null = null;\n  #activeAction: StereoAction | null = null;\n  #starting = false;''',
              'stereo state fields',
          )
          text = replace_once(
              text,
              '''    this.#clearFinishTimer();\n    this.#runToken += 1;\n    this.#playback = null;''',
              '''    this.#clearFinishTimer();\n    this.#clearReturnTimer();\n    this.#runToken += 1;\n    this.#activeAction = null;\n    this.#playback = null;''',
              'stereo dispose state',
          )
          text = replace_once(
              text,
              '''      this.#starting = false;\n      this.#setControlsActive(true);\n      this.#setVisual(action, actionLabel(action));''',
              '''      this.#starting = false;\n      this.#activeAction = action;\n      this.#setControlsActive(true);\n      this.#setVisual(action, actionLabel(action));''',
              'stereo static active action',
          )
          text = replace_once(
              text,
              '''      this.#playback = playback;\n      this.#starting = false;\n      this.#setControlsActive(true);''',
              '''      this.#playback = playback;\n      this.#starting = false;\n      this.#activeAction = action;\n      this.#setControlsActive(true);''',
              'stereo pan active action',
          )
          text = replace_once(
              text,
              '''  #beginStart(): number {\n    this.#runToken += 1;''',
              '''  #beginStart(): number {\n    this.#clearReturnTimer();\n    this.#runToken += 1;''',
              'stereo begin start',
          )
          text = replace_once(
              text,
              '''    this.#starting = false;\n    this.#playback = null;\n    this.#clearFinishTimer();''',
              '''    this.#starting = false;\n    this.#activeAction = null;\n    this.#playback = null;\n    this.#clearFinishTimer();\n    this.#clearReturnTimer();''',
              'stereo start error reset',
          )
          text = replace_once(
              text,
              '''    this.#starting = false;\n    this.#clearFinishTimer();\n    this.#playback?.stop();\n    this.#playback = null;''',
              '''    this.#starting = false;\n    this.#clearFinishTimer();\n    this.#clearReturnTimer();\n    this.#activeAction = null;\n    this.#playback?.stop();\n    this.#playback = null;''',
              'stereo stop reset',
          )
          old_finish = '''  #finishRun(): void {\n    this.#finishTimer = null;\n    this.#starting = false;\n    this.#playback = null;\n    this.#setControlsActive(false);\n    this.#setVisual("center", "None");\n    this.#setStatus("idle", "Ready for another check");\n  }'''
          new_finish = '''  #finishRun(): void {\n    const finishedAction = this.#activeAction;\n    this.#finishTimer = null;\n    this.#starting = false;\n    this.#activeAction = null;\n    this.#playback = null;\n    this.#setControlsActive(false);\n    if (\n      finishedAction === "left-to-right" ||\n      finishedAction === "right-to-left"\n    ) {\n      this.#returnPanVisual(finishedAction);\n    } else {\n      this.#setVisual("center", "None");\n    }\n    this.#setStatus("idle", "Ready for another check");\n  }\n\n  #returnPanVisual(\n    action: "left-to-right" | "right-to-left",\n  ): void {\n    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {\n      this.#setVisual("center", "None");\n      return;\n    }\n\n    this.#root.dataset.stereoVisual =\n      action === "left-to-right" ? "return-from-right" : "return-from-left";\n    this.#positionLabel.textContent = "Returning to center";\n    this.#returnTimer = window.setTimeout(() => {\n      this.#returnTimer = null;\n      if (!this.#disposed) this.#setVisual("center", "None");\n    }, PAN_RETURN_MS);\n  }'''
          text = replace_once(text, old_finish, new_finish, 'stereo finish return')
          text = replace_once(
              text,
              '''  #clearFinishTimer(): void {\n    if (this.#finishTimer === null) return;\n    window.clearTimeout(this.#finishTimer);\n    this.#finishTimer = null;\n  }''',
              '''  #clearFinishTimer(): void {\n    if (this.#finishTimer === null) return;\n    window.clearTimeout(this.#finishTimer);\n    this.#finishTimer = null;\n  }\n\n  #clearReturnTimer(): void {\n    if (this.#returnTimer === null) return;\n    window.clearTimeout(this.#returnTimer);\n    this.#returnTimer = null;\n  }''',
              'stereo clear return timer',
          )
          text = replace_once(
              text,
              '''  #setVisual(action: StereoAction | "center", label: string): void {\n    this.#root.dataset.stereoVisual = action;\n    this.#positionLabel.textContent = label;\n  }''',
              '''  #setVisual(action: StereoAction | "center", label: string): void {\n    this.#root.dataset.stereoVisual = action;\n    this.#positionLabel.textContent = label;\n    for (const button of this.#actionButtons) {\n      button.setAttribute(\n        "aria-pressed",\n        String(button.dataset.stereoAction === action),\n      );\n    }\n  }''',
              'stereo visual pressed state',
          )
          stereo_controller.write_text(text)

          speaker_layout = Path('tests/browser/speaker-layout.spec.ts')
          text = speaker_layout.read_text()
          text += r'''

test("Speaker spatial anchors stay fixed across mode changes", async ({ page }) => {
  await page.setViewportSize({ width: 1366, height: 768 });
  await page.goto("/speaker-test");

  const anchors = page.locator("[data-speaker-anchor]");
  const before = await anchors.evaluateAll((elements) =>
    elements.map((element) => {
      const box = element.getBoundingClientRect();
      return { x: box.x + box.width / 2, y: box.y + box.height / 2 };
    }),
  );

  for (const name of ["Phase", "Sweep", "Bass / rattle", "Channel"]) {
    await page.getByRole("button", { name, exact: true }).click();
    const after = await anchors.evaluateAll((elements) =>
      elements.map((element) => {
        const box = element.getBoundingClientRect();
        return { x: box.x + box.width / 2, y: box.y + box.height / 2 };
      }),
    );
    expect(after).toEqual(before);
  }
});
'''
          speaker_layout.write_text(text)

          stereo_layout = Path('tests/browser/stereo-phase-layout.spec.ts')
          text = stereo_layout.read_text()
          text += r'''

test("Stereo exposes direct field targets and a deterministic natural return animation", async ({ page }) => {
  await page.setViewportSize({ width: 1366, height: 768 });
  await page.goto("/stereo-test");

  await expect(page.locator("[data-sonic-instrument]")).toHaveCount(1);
