name: Temporary Sonic Field spatial slice 1

on:
  push:
    branches:
      - feat/sonic-field-spatial-output-family
    paths:
      - .github/workflows/tmp-sonic-spatial-slice1.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Speaker and Stereo Sonic Field migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_component(path: str, root_marker: str, import_old: str, import_new: str, markup: str, style: str) -> None:
              target = Path(path)
              text = target.read_text()
              if import_old not in text:
                  raise SystemExit(f'import anchor not found in {path}')
              text = text.replace(import_old, import_new, 1)
              start = text.index(root_marker)
              script_start = text.index('<script>', start)
              script_end = text.index('</script>', script_start) + len('</script>')
              front = text[:start]
              script = text[script_start:script_end]
              target.write_text(front + markup.strip() + '\n\n' + script + '\n\n' + style.strip() + '\n')

