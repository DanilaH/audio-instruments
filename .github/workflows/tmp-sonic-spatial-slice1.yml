  await expect(page.locator(".stereo-track__signal")).toHaveCSS(
    "animation-name",
    "stereo-return-right",
  );

  await page.emulateMedia({ reducedMotion: "reduce" });
  await expect(page.locator(".stereo-track__signal")).toHaveCSS(
    "animation-name",
    "none",
  );
});
'''
          stereo_layout.write_text(text)
