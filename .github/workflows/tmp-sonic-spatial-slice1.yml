name: Temporary Sonic Field PR2 acceptance QA

on:
  push:
    branches:
      - feat/sonic-field-spatial-output-family
    paths:
      - .github/workflows/tmp-sonic-spatial-slice1.yml
      - tests/browser/tmp-sonic-spatial-screenshot-qa.spec.ts
      - tests/browser/sonic-field-spatial-output-production-layout.spec.ts
      - src/tools/speaker-test/**
      - src/tools/stereo-test/**
      - src/tools/surround-sound-test/**
      - src/tools/phase-test/**

permissions:
  contents: write

jobs:
  acceptance-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply surgical Surround compact buffer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tools/surround-sound-test/SurroundSoundTest.astro")
          text = path.read_text()

          field_old = """    .surround-field {\n      min-height: 256px;\n      padding-block: 10px 9px;\n    }"""
          field_new = """    .surround-field {\n      min-height: 246px;\n      padding-block: 10px 9px;\n    }"""
          stage_old = """    .surround-stage {\n      height: 174px;\n      min-height: 174px;\n    }"""
          stage_new = """    .surround-stage {\n      height: 164px;\n      min-height: 164px;\n    }"""

          if field_new not in text:
              if field_old not in text:
                  raise SystemExit("Surround compact field anchor not found")
              text = text.replace(field_old, field_new, 1)

          if stage_new not in text:
              if stage_old not in text:
                  raise SystemExit("Surround compact stage anchor not found")
              text = text.replace(stage_old, stage_new, 1)

          path.write_text(text)
          PY
      - name: Format PR2 QA specs
        run: pnpm exec prettier --write tests/browser/sonic-field-spatial-output-production-layout.spec.ts tests/browser/tmp-sonic-spatial-screenshot-qa.spec.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify PR2 production viewport acceptance
        run: pnpm exec playwright test tests/browser/sonic-field-spatial-output-production-layout.spec.ts --project=chromium --project=firefox --project=webkit
      - name: Capture PR2 Chromium perceptual QA
        run: pnpm exec playwright test tests/browser/tmp-sonic-spatial-screenshot-qa.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: sonic-field-pr2-screenshot-qa
          path: artifacts/spatial-output-screenshots
          if-no-files-found: error
      - name: Persist verified acceptance fixes
        run: |
          if git diff --quiet -- src/tools/surround-sound-test/SurroundSoundTest.astro tests/browser/sonic-field-spatial-output-production-layout.spec.ts tests/browser/tmp-sonic-spatial-screenshot-qa.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/surround-sound-test/SurroundSoundTest.astro tests/browser/sonic-field-spatial-output-production-layout.spec.ts tests/browser/tmp-sonic-spatial-screenshot-qa.spec.ts
          git commit -m "fix: add Surround compact viewport buffer"
          git push origin HEAD:feat/sonic-field-spatial-output-family
