name: PR6 Audio Latency Remediation

on:
  push:
    branches:
      - feat/sonic-field-audio-latency

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sonic-field-audio-latency

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply diagnosed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          astro = Path("src/tools/audio-latency/AudioLatency.astro")
          text = astro.read_text()
          old = "\n    .latency-sync-field {\n      grid-template-columns: 44px minmax(0, 1fr);\n    }"
          new = "\n    .latency-result {\n      min-height: 2.5em;\n      line-height: 1.25;\n    }\n\n    .latency-sync-field {\n      grid-template-columns: 44px minmax(0, 1fr);\n    }"
          if text.count(old) != 1:
              raise SystemExit(f"AudioLatency mobile anchor count={text.count(old)}")
          astro.write_text(text.replace(old, new, 1))

          layout = Path("tests/browser/audio-latency-layout.spec.ts")
          text = layout.read_text()
          old = "expect(offsetBox?.height ?? 0).toBeGreaterThanOrEqual(44);"
          new = "expect(offsetBox?.height ?? 0).toBeGreaterThanOrEqual(44 - 0.01);"
          if text.count(old) != 1:
              raise SystemExit(f"Audio Latency touch anchor count={text.count(old)}")
          layout.write_text(text.replace(old, new, 1))

          production = Path("tests/browser/sonic-field-audio-latency-production-layout.spec.ts")
          text = production.read_text()
          old = "  await setOffset(page, -300);\n  const beforeX = await centerX(marker);\n  await expect(marker).toHaveAttribute(\"data-offset-relation\", \"before\");\n  expect(beforeX).toBeLessThan(visualX - 20);\n\n  await setOffset(page, 300);\n  const afterX = await centerX(marker);\n  await expect(marker).toHaveAttribute(\"data-offset-relation\", \"after\");\n  expect(afterX).toBeGreaterThan(visualX + 20);"
          new = "  await setOffset(page, -300);\n  await expect(marker).toHaveAttribute(\"data-offset-relation\", \"before\");\n  await expect.poll(async () => centerX(marker)).toBeLessThan(visualX - 20);\n\n  await setOffset(page, 300);\n  await expect(marker).toHaveAttribute(\"data-offset-relation\", \"after\");\n  await expect.poll(async () => centerX(marker)).toBeGreaterThan(visualX + 20);"
          if text.count(old) != 1:
              raise SystemExit(f"Audio Latency marker anchor count={text.count(old)}")
          production.write_text(text.replace(old, new, 1))
          PY

      - name: Format remediated files
        run: pnpm exec prettier --write src/tools/audio-latency/AudioLatency.astro tests/browser/audio-latency-layout.spec.ts tests/browser/sonic-field-audio-latency-production-layout.spec.ts

      - name: Commit remediation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/audio-latency/AudioLatency.astro tests/browser/audio-latency-layout.spec.ts tests/browser/sonic-field-audio-latency-production-layout.spec.ts
          git diff --cached --check
          git commit -m "fix: stabilize Audio Latency mobile geometry"
          git push origin HEAD:feat/sonic-field-audio-latency