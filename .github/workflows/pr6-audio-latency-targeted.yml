name: PR6 Audio Latency Mobile Diagnostic

on:
  push:
    branches:
      - feat/sonic-field-audio-latency

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Add runner-only mobile geometry diagnostic
        run: |
          cat > tests/browser/pr6-mobile-diagnostic.spec.ts <<'TS'
          import { test } from "@playwright/test";

          const selectors = [
            "[data-sonic-instrument]",
            ".latency-sheet__bar",
            ".latency-offset-summary",
            ".latency-field",
            ".latency-result-band",
            ".latency-result",
            ".latency-rail",
            ".latency-transport",
            ".latency-offset-control",
            ".latency-field-header",
            ".latency-field-header output",
            ".latency-reported",
            ".latency-safety-strip",
          ];

          async function snapshot(page: import("@playwright/test").Page) {
            return page.evaluate((selectorList) => {
              const entries = selectorList.map((selector) => {
                const elements = [...document.querySelectorAll<HTMLElement>(selector)];
                return [
                  selector,
                  elements.map((element) => {
                    const rect = element.getBoundingClientRect();
                    const style = getComputedStyle(element);
                    return {
                      text: element.textContent?.trim().replace(/\s+/g, " "),
                      x: rect.x,
                      y: rect.y,
                      width: rect.width,
                      height: rect.height,
                      lineHeight: style.lineHeight,
                      whiteSpace: style.whiteSpace,
                    };
                  }),
                ];
              });
              return {
                documentHeight: document.documentElement.scrollHeight,
                entries: Object.fromEntries(entries),
              };
            }, selectors);
          }

          test("report Audio Latency 320px offset reflow", async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.goto("/audio-latency-test");
            const before = await snapshot(page);
            await page.locator("[data-latency-offset]").evaluate((element) => {
              const input = element as HTMLInputElement;
              input.value = "300";
              input.dispatchEvent(new Event("input", { bubbles: true }));
            });
            await page.waitForTimeout(150);
            const after = await snapshot(page);
            console.log("PR6_GEOMETRY=" + JSON.stringify({ before, after }));
          });
          TS

      - name: Run mobile geometry diagnostic
        run: pnpm exec playwright test tests/browser/pr6-mobile-diagnostic.spec.ts --project=chromium --workers=1