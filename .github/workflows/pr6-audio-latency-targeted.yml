name: PR6 Audio Latency Formatter

on:
  push:
    branches:
      - feat/sonic-field-audio-latency

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format PR6 files
        run: pnpm exec prettier --write src/tools/audio-latency/AudioLatency.astro src/tools/audio-latency/AudioLatencyController.ts tests/browser/audio-latency-layout.spec.ts tests/browser/sonic-field-audio-latency-production-layout.spec.ts tests/browser/tool-touch-targets.spec.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: pr6-formatted-files
          path: |
            src/tools/audio-latency/AudioLatency.astro
            src/tools/audio-latency/AudioLatencyController.ts
            tests/browser/audio-latency-layout.spec.ts
            tests/browser/sonic-field-audio-latency-production-layout.spec.ts
            tests/browser/tool-touch-targets.spec.ts
          retention-days: 1
