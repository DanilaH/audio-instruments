name: PR6 Audio Latency Formatter

on:
  push:
    branches:
      - feat/sonic-field-audio-latency

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sonic-field-audio-latency

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format PR6 files
        run: pnpm exec prettier --write src/tools/audio-latency/AudioLatency.astro src/tools/audio-latency/AudioLatencyController.ts tests/browser/audio-latency-layout.spec.ts tests/browser/sonic-field-audio-latency-production-layout.spec.ts tests/browser/tool-touch-targets.spec.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- src/tools/audio-latency/AudioLatency.astro src/tools/audio-latency/AudioLatencyController.ts tests/browser/audio-latency-layout.spec.ts tests/browser/sonic-field-audio-latency-production-layout.spec.ts tests/browser/tool-touch-targets.spec.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/audio-latency/AudioLatency.astro src/tools/audio-latency/AudioLatencyController.ts tests/browser/audio-latency-layout.spec.ts tests/browser/sonic-field-audio-latency-production-layout.spec.ts tests/browser/tool-touch-targets.spec.ts
          git commit -m "style: format Audio Latency migration"
          git push origin HEAD:feat/sonic-field-audio-latency
