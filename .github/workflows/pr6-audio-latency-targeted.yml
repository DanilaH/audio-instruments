name: PR6 Audio Latency Targeted

on:
  push:
    branches:
      - feat/sonic-field-audio-latency

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Astro and TypeScript check
        run: pnpm check

      - name: AV sync timeline unit tests
        run: pnpm exec vitest run tests/unit/av-sync-timeline.test.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Audio Latency browser regression
        run: >-
          pnpm exec playwright test
          tests/browser/audio-latency.spec.ts
          tests/browser/audio-latency-layout.spec.ts
          tests/browser/sonic-field-audio-latency-production-layout.spec.ts
          tests/browser/runtime-layout-stability.spec.ts
          tests/browser/tool-touch-targets.spec.ts
          --project=chromium --project=firefox --project=webkit

      - name: Add runner-only rendered QA
        run: |
          cat >> tests/browser/audio-latency.spec.ts <<'TS'

          test("PR6 rendered QA active Audio Latency", async ({ page }, testInfo) => {
            await installLatencyHarness(page, {
              baseLatency: 0.01254,
              outputLatency: 0.03444,
            });

            for (const viewport of [
              { width: 1366, height: 768 },
              { width: 1280, height: 720 },
              { width: 390, height: 844 },
              { width: 320, height: 844 },
            ]) {
              await page.setViewportSize(viewport);
              await page.goto("/audio-latency-test");
              await page.locator("[data-latency-start]").click();
              await expect(
                page.locator("#audio-latency-status [data-status-label]"),
              ).toHaveText("AV sync loop active");
              await setOffset(page, 300);
              await expect(
                page.locator("[data-latency-offset-marker]"),
              ).toHaveAttribute("data-offset-relation", "after");
              await page.waitForTimeout(120);

              await page.screenshot({
                path: `pr6-visual/${testInfo.project.name}-${viewport.width}x${viewport.height}.png`,
                fullPage: false,
              });
            }
          });
          TS

      - name: Capture rendered QA
        run: |
          mkdir -p pr6-visual
          pnpm exec playwright test tests/browser/audio-latency.spec.ts --grep "PR6 rendered QA active Audio Latency" --project=chromium --project=firefox --project=webkit

      - name: Upload rendered QA
        uses: actions/upload-artifact@v7
        with:
          name: pr6-audio-latency-visual-qa
          path: pr6-visual
          retention-days: 30
