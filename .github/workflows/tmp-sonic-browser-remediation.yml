name: Temporary Sonic Field browser remediation

on:
  push:
    branches:
      - feat/sonic-field-foundation-stress-trio
    paths:
      - .github/workflows/tmp-sonic-browser-remediation.yml

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply browser-contract remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('tests/browser/runtime-layout-stability.spec.ts')
          text = runtime.read_text()
          old = '.querySelector(".instrument-surface")'
          new = '.querySelector(".instrument-surface, [data-sonic-instrument]")'
          if old not in text:
              raise SystemExit('runtime surface selector not found')
          runtime.write_text(text.replace(old, new, 1))

          touch = Path('tests/browser/tool-touch-targets.spec.ts')
          text = touch.read_text()
          old = 'selectors: [".spectrum-field select", ".spectrum-view-switch button"],'
          new = '''selectors: [
              ".spectrum-control-field select",
              ".spectrum-view-switch button",
              ".spectrum-start",
              ".spectrum-stop",
            ],'''
          if old not in text:
              raise SystemExit('spectrum touch-target selectors not found')
          text = text.replace(old, new, 1)
          old = 'expect(box.height).toBeGreaterThanOrEqual(44);'
          new = 'expect(box.height).toBeGreaterThanOrEqual(44 - 0.01);'
          if old not in text:
              raise SystemExit('native playback height assertion not found')
          touch.write_text(text.replace(old, new, 1))

          spectrum = Path('src/tools/spectrum-analyzer/SpectrumAnalyzer.astro')
          text = spectrum.read_text()
          replacements = [
              (
                  '''  .spectrum-start,\n  .spectrum-stop,\n  .spectrum-view-switch button {\n    display: inline-flex;\n    min-height: 42px;''',
                  '''  .spectrum-start,\n  .spectrum-stop,\n  .spectrum-view-switch button {\n    display: inline-flex;\n    min-height: 44px;''',
                  'spectrum button height block',
              ),
              (
                  '''  .spectrum-control-field select {\n    min-width: 0;\n    min-height: 38px;''',
                  '''  .spectrum-control-field select {\n    min-width: 0;\n    min-height: 44px;''',
                  'spectrum select height block',
              ),
              (
                  '''    .spectrum-rail {\n      min-height: 142px;\n    }''',
                  '''    .spectrum-rail {\n      min-height: 140px;\n    }\n\n    .spectrum-rail > * {\n      padding-block: 11px;\n    }''',
                  'compact spectrum rail height block',
              ),
              (
                  '''    .spectrum-view-switch button {\n      min-width: 0;\n      padding-inline: 4px;\n      font-size: 0.68rem;\n    }''',
                  '''    .spectrum-view-switch button {\n      min-width: 0;\n      padding-inline: 2px;\n      font-size: 0.68rem;\n    }''',
                  'narrow spectrum view-switch block',
              ),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)
          spectrum.write_text(text)
          PY
      - run: pnpm exec prettier --write tests/browser/runtime-layout-stability.spec.ts tests/browser/tool-touch-targets.spec.ts src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify browser remediation
        run: |
          pnpm exec playwright test \
            tests/browser/runtime-layout-stability.spec.ts \
            tests/browser/tool-touch-targets.spec.ts \
            tests/browser/sonic-field-production-layout.spec.ts \
            --project=chromium --project=firefox --project=webkit
      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/runtime-layout-stability.spec.ts tests/browser/tool-touch-targets.spec.ts src/tools/spectrum-analyzer/SpectrumAnalyzer.astro
          git commit -m "fix: restore browser layout and touch contracts"
          git push origin HEAD:feat/sonic-field-foundation-stress-trio
