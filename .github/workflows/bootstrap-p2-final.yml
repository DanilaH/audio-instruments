name: Bootstrap P2 Final Developer Gate

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  final-developer-gate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Normalize P2.1 sources
        run: pnpm exec prettier --write "src/**/*.{astro,css,js,mjs,ts}" "tests/**/*.{js,mjs,ts}" "playwright.config.ts" "vitest.config.ts" "eslint.config.mjs" ".prettierrc.mjs" "astro.config.mjs" "pnpm-workspace.yaml" "package.json" "tsconfig.json"
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - name: Commit normalized sources and remove temporary workflow
        run: |
          rm .github/workflows/bootstrap-p2-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize P2.1 developer gate"
          git push origin HEAD:${{ github.head_ref }}
