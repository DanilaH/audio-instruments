name: Temporary apply runtime layout fixes

on:
  push:
    branches:
      - fix/runtime-layout-stability
    paths:
      - .github/workflows/temp-apply-runtime-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Apply validated product patch
        run: |
          python scripts/temp-apply-product-layout-fixes.py
          python scripts/temp-apply-audio-latency-layout-fix.py

      - name: Format changed sources and regression test
        run: |
          pnpm exec prettier --write \
            src/tools/speaker-test/SpeakerTest.astro \
            src/tools/headphone-test/HeadphoneTest.astro \
            src/tools/bass-test/BassTest.astro \
            src/tools/noise-generator/NoiseGenerator.astro \
            src/tools/frequency-sweep/FrequencySweep.astro \
            src/tools/spectrum-analyzer/SpectrumAnalyzer.astro \
            src/tools/audio-latency/AudioLatency.astro \
            tests/browser/runtime-layout-stability.spec.ts

      - run: git diff --check
      - run: pnpm check

      - name: Commit product patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/tools/speaker-test/SpeakerTest.astro \
            src/tools/headphone-test/HeadphoneTest.astro \
            src/tools/bass-test/BassTest.astro \
            src/tools/noise-generator/NoiseGenerator.astro \
            src/tools/frequency-sweep/FrequencySweep.astro \
            src/tools/spectrum-analyzer/SpectrumAnalyzer.astro \
            src/tools/audio-latency/AudioLatency.astro \
            tests/browser/runtime-layout-stability.spec.ts
          git diff --cached --quiet && { echo "No product changes staged"; exit 1; }
          git commit -m "fix: stabilize runtime instrument layouts"
          git push origin HEAD:fix/runtime-layout-stability
