name: Temp ready PR 75

on: push

jobs:
  ready:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm .github/workflows/temp-ready-pr75.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-ready-pr75.yml
          git commit -m "chore: remove temporary ready workflow"
          git push origin HEAD:docs/vps-rollout-source-truth
      - run: gh pr ready 75 --repo DanilaH/audio-instruments
        env:
          GH_TOKEN: ${{ github.token }}
