name: PR4 Visual QA

on:
  push:
    branches:
      - feat/sonic-field-input-measurement-family

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/sonic-field-input-measurement-family

      - name: Setup pnpm and Node
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Capture PR4 rendered states
        run: |
          pnpm preview --host 127.0.0.1 > /tmp/pr4-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/microphone-test > /dev/null; then
              break
            fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import { chromium, firefox, webkit } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';

          const base = 'http://127.0.0.1:4321';
          const engines = { chromium, firefox, webkit };
          await mkdir('pr4-visual-qa', { recursive: true });

          for (const [engineName, engine] of Object.entries(engines)) {
            const browser = await engine.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1366, height: 768 } });

            for (const [name, path] of [
              ['microphone', '/microphone-test'],
              ['decibel', '/decibel-meter'],
              ['pitch', '/pitch-detector'],
            ]) {
              await page.setViewportSize({ width: 1366, height: 768 });
              await page.goto(`${base}${path}`);
              await page.screenshot({ path: `pr4-visual-qa/${engineName}-${name}-desktop.png` });

              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(`${base}${path}`);
              await page.screenshot({ path: `pr4-visual-qa/${engineName}-${name}-mobile.png` });
            }

            await page.setViewportSize({ width: 1366, height: 768 });
            await page.goto(`${base}/microphone-test`);
            await page.locator('[data-mic-playback]').evaluate((element) => element.removeAttribute('hidden'));
            await page.screenshot({ path: `pr4-visual-qa/${engineName}-microphone-playback.png` });

            await page.goto(`${base}/decibel-meter`);
            await page.locator('[data-db-calibration-disclosure] summary').click();
            await page.screenshot({ path: `pr4-visual-qa/${engineName}-decibel-calibration.png` });

            await browser.close();
          }
          NODE

      - name: Upload PR4 visual QA
        uses: actions/upload-artifact@v4
        with:
          name: pr4-visual-qa
          path: pr4-visual-qa
          if-no-files-found: error
