name: Temp docs sync

on: push

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/temp-doc-source-truth-sync.py
      - run: git diff --check
      - run: |
          rm scripts/temp-doc-source-truth-sync.py
          rm .github/workflows/temp-doc-source-truth-sync.yml
          git config user.name "DanilaH"
          git config user.email "41333602+DanilaH@users.noreply.github.com"
          git add README.md docs/11_RELEASE_AND_ANALYTICS.md scripts/temp-doc-source-truth-sync.py .github/workflows/temp-doc-source-truth-sync.yml
          git commit -m "docs: align final release source of truth"
          git push origin HEAD:docs/vps-rollout-source-truth
