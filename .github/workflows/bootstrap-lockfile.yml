name: Bootstrap Lockfile

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false
      - run: pnpm install --lockfile-only
      - uses: actions/upload-artifact@v7
        with:
          name: p0-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
