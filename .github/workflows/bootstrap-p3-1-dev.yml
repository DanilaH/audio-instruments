name: Bootstrap P3.1 Developer Gate

on:
  push:
    branches:
      - p3-1-sound-test

permissions:
  contents: write

concurrency:
  group: bootstrap-p3-1-dev
  cancel-in-progress: true

jobs:
  p3-1-dev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: p3-1-sound-test

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize P3.1 sources
        run: pnpm exec prettier --write src/browser/audio-output/AudioOutputEngine.ts src/pages/sound-test.astro src/registry/tools.ts src/tools/sound-test/SoundTest.astro src/tools/sound-test/SoundTestController.ts tests/browser/sound-test.spec.ts tests/browser/sound-layout.spec.ts tests/unit/audio-output-burst.test.ts tests/unit/registry.test.ts

      - name: Lint P3.1 sources
        run: pnpm exec eslint src/browser/audio-output/AudioOutputEngine.ts src/pages/sound-test.astro src/registry/tools.ts src/tools/sound-test/SoundTest.astro src/tools/sound-test/SoundTestController.ts tests/browser/sound-test.spec.ts tests/browser/sound-layout.spec.ts tests/unit/audio-output-burst.test.ts tests/unit/registry.test.ts

      - name: Astro and TypeScript check
        run: pnpm check

      - name: Unit and service regression
        run: pnpm exec vitest run tests/unit/audio-output-engine.test.ts tests/unit/audio-output-burst.test.ts tests/unit/registry.test.ts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Sound, shell and Tone browser regression
        run: pnpm build && pnpm exec playwright test tests/browser/sound-test.spec.ts tests/browser/sound-layout.spec.ts tests/browser/shell.spec.ts tests/browser/tone-generator.spec.ts

      - name: Capture Sound Test visual QA
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4321 > /tmp/p3-1-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/sound-test > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/sound-test > /dev/null
          mkdir -p visual-qa
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch();
          for (const viewport of [
            { width: 1366, height: 768 },
            { width: 390, height: 844 },
          ]) {
            const page = await browser.newPage({ viewport });
            await page.goto('http://127.0.0.1:4321/sound-test', { waitUntil: 'networkidle' });
            await page.screenshot({
              path: `visual-qa/sound-${viewport.width}x${viewport.height}-fold.png`,
              fullPage: false,
            });
            await page.screenshot({
              path: `visual-qa/sound-${viewport.width}x${viewport.height}-full.png`,
              fullPage: true,
            });
            await page.close();
          }
          await browser.close();
          NODE

      - name: Upload Sound Test visual QA
        uses: actions/upload-artifact@v7
        with:
          name: p3-1-sound-visual-qa-${{ github.run_id }}
          path: visual-qa
          if-no-files-found: error
          retention-days: 7

      - name: Commit normalized sources and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser/audio-output/AudioOutputEngine.ts src/pages/sound-test.astro src/registry/tools.ts src/tools/sound-test/SoundTest.astro src/tools/sound-test/SoundTestController.ts tests/browser/sound-test.spec.ts tests/browser/sound-layout.spec.ts tests/unit/audio-output-burst.test.ts tests/unit/registry.test.ts
          git rm .github/workflows/bootstrap-p3-1-dev.yml
          git commit -m "chore: finalize P3.1 developer validation"
          git push origin HEAD:p3-1-sound-test
