name: Temporary Sonic Field v3 render

on:
  push:
    branches:
      - prototype/audio-identity-v3-sonic-field
    paths:
      - .github/workflows/tmp-sonic-field-v3-render.yml
      - src/components/prototypes/SonicFieldPrototype.astro
      - src/pages/prototypes/audio-identity-v3/**
      - docs/16_AUDIO_IDENTITY_V3_SONIC_FIELD.md

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Validate Sonic Field prototype
        run: |
          pnpm exec prettier --write src/components/prototypes/SonicFieldPrototype.astro src/pages/prototypes/audio-identity-v3/*.astro docs/16_AUDIO_IDENTITY_V3_SONIC_FIELD.md
          git diff --check
          pnpm check
          pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - name: Capture desktop and mobile prototypes
        run: |
          mkdir -p sonic-field-v3-renders
          cat > tests/browser/tmp-sonic-field-v3.spec.ts <<'EOF'
          import { test } from "@playwright/test";

          const tools = ["headphone", "spectrum", "hearing"] as const;
          const viewports = [
            { name: "desktop", width: 1366, height: 768 },
            { name: "mobile", width: 390, height: 844 },
          ] as const;

          for (const tool of tools) {
            for (const viewport of viewports) {
              test(`${tool}-${viewport.name}`, async ({ page }) => {
                await page.setViewportSize({ width: viewport.width, height: viewport.height });
                await page.goto(`/prototypes/audio-identity-v3/${tool}`);
                await page.screenshot({
                  path: `sonic-field-v3-renders/${tool}-${viewport.width}x${viewport.height}.png`,
                  fullPage: false,
                });
              });
            }
          }
          EOF
          pnpm exec playwright test tests/browser/tmp-sonic-field-v3.spec.ts --project=chromium --workers=1 --reporter=line
          rm tests/browser/tmp-sonic-field-v3.spec.ts

      - uses: actions/upload-artifact@v7
        with:
          name: sonic-field-v3-renders-${{ github.run_id }}
          path: sonic-field-v3-renders
          if-no-files-found: error
          retention-days: 14
